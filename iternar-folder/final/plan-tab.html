<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Travel Planner Map</title>
<link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{
  --nav-h:48px;
  --lw:340px; --rw:300px;      /* panel widths (resizable) */
  --left-w:0px; --right-w:0px; /* space taken by open panels (set by JS) */
  --accent:#0f172a; --accent-text:#fff;
  --text-primary:#0f172a; --text-muted:#64748b; --text-faint:#94a3b8;
  --sidebar-bg:rgba(255,255,255,.94);
  --sidebar-shadow:0 8px 40px rgba(0,0,0,.14),0 0 0 1px rgba(0,0,0,.05);
  --bg-hover:#f1f5f9; --bg-selected:#e8eefc; --bg-card:#fff; --bg-tertiary:#e2e8f0;
  --border-primary:#e2e8f0; --border-faint:#eef1f5;
  --green:#059669;
  --font-system:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;font-family:var(--font-system);background:#cbd5e1;color:var(--text-primary)}
button{font-family:inherit}
svg{flex-shrink:0}
#map{position:absolute;inset:0;z-index:1}

/* ---------- top nav ---------- */
.top-nav{position:fixed;top:0;left:0;right:0;height:var(--nav-h);z-index:200;display:flex;align-items:center;justify-content:center;padding:0 12px;background:rgba(255,255,255,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--border-primary)}
.tabs{position:relative;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.tabs::-webkit-scrollbar{display:none}
.pill{position:absolute;top:50%;left:0;width:80px;height:32px;background:var(--accent);border-radius:20px;transform:translateY(-50%);transition:left .32s cubic-bezier(.77,0,.175,1),width .32s cubic-bezier(.77,0,.175,1);z-index:0;pointer-events:none}
.tab{position:relative;z-index:1;display:flex;align-items:center;gap:6px;padding:6px 16px;border:0;border-radius:20px;background:transparent;color:var(--text-muted);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;transition:color .22s}
.tab.active{color:#fff;font-weight:600}

/* ---------- floating side panels ---------- */
.side{position:fixed;top:calc(var(--nav-h) + 10px);bottom:10px;z-index:100;isolation:isolate}
.side.left{left:10px;width:var(--lw)}
.side.right{right:10px;width:var(--rw)}
.side.collapsed{display:none}
.panel{position:relative;width:100%;height:100%;background:var(--sidebar-bg);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);box-shadow:var(--sidebar-shadow);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.tab-handle{position:absolute;top:14px;z-index:-1;width:36px;height:36px;border:0;background:var(--sidebar-bg);backdrop-filter:blur(20px);display:flex;align-items:center;justify-content:center;color:var(--text-faint);cursor:pointer}
.side.left .tab-handle{right:-28px;border-radius:0 10px 10px 0}
.side.right .tab-handle{left:-28px;border-radius:10px 0 0 10px}
.tab-handle:hover{color:var(--text-primary)}
.open-btn{position:fixed;top:calc(var(--nav-h) + 14px);z-index:110;width:36px;height:36px;border:0;border-radius:10px;background:#000;color:#fff;box-shadow:0 2px 12px rgba(0,0,0,.2);display:none;align-items:center;justify-content:center;cursor:pointer}
.open-btn.show{display:flex}
.open-btn.l{left:10px}.open-btn.r{right:10px}
.resizer{position:absolute;top:0;bottom:0;width:6px;z-index:5;cursor:col-resize}
.side.left .resizer{right:0}.side.right .resizer{left:0}
.resizer:hover,.resizer.drag{background:rgba(0,120,255,.35)}

/* ---------- left panel ---------- */
.p-head{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:12px 16px;border-bottom:1px solid var(--border-faint);flex-shrink:0}
.export-btn{display:flex;align-items:center;gap:5px;padding:5px 10px;border:0;border-radius:8px;background:var(--accent);color:#fff;font-size:11px;font-weight:500;cursor:pointer}
.sq{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border:1px solid var(--border-primary);border-radius:8px;background:none;color:var(--text-primary);cursor:pointer}
.sq:hover{background:var(--bg-hover)}
.days{flex:1;min-height:0;overflow-y:auto}
.day{border-bottom:1px solid var(--border-faint)}
.day-h{display:flex;align-items:center;gap:10px;padding:11px 14px 11px 16px;cursor:pointer;user-select:none;transition:background .12s}
.day-h:hover{background:rgba(0,0,0,.02)}
.day.sel>.day-h{background:var(--bg-selected)}
.badge{flex-shrink:0;align-self:flex-start;width:34px;border-radius:11px;background:var(--bg-hover);color:var(--text-muted);display:flex;flex-direction:column;align-items:center;overflow:hidden}
.day.sel .badge{background:var(--accent);color:#fff}
.badge .n{height:26px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.badge hr{width:64%;border:0;height:1px;background:currentColor;opacity:.25}
.badge .t{padding:3px 0 4px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:9.5px;font-weight:600}
.d-info{flex:1;min-width:0}
.d-row{display:flex;align-items:center;gap:7px;min-width:0}
.d-title{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.vsep{width:1px;height:11px;background:var(--border-primary);flex-shrink:0}
.d-date{font-size:11px;color:var(--text-faint);white-space:nowrap;flex-shrink:0}
.d-cost{margin-top:2px;font-size:11px;color:var(--green)}
.d-actions{align-self:flex-start;display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--border-faint);border-radius:9px;overflow:hidden;background:#fff}
.d-actions button{display:grid;place-items:center;padding:7px;border:0;background:none;color:var(--text-muted);cursor:pointer}
.d-actions button:hover{background:var(--bg-hover);color:var(--text-primary)}
.d-actions button:nth-child(1),.d-actions button:nth-child(3){border-right:1px solid var(--border-faint)}
.d-actions button:nth-child(1),.d-actions button:nth-child(2){border-bottom:1px solid var(--border-faint)}
.day-body{background:var(--bg-hover);padding-top:6px;display:none}
.day.open .day-body{display:block}
.stop{display:flex;align-items:center;gap:8px;padding:7px 8px 7px 10px;cursor:pointer;border-left:3px solid transparent;transition:background .15s}
.stop:hover{background:rgba(0,0,0,.03)}
.stop.sel{background:var(--bg-selected);border-left-color:var(--accent)}
.grip{color:var(--text-faint);opacity:.35;display:flex}
.avatar{width:28px;height:28px;border-radius:50%;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.avatar img{width:100%;height:100%;object-fit:cover}
.s-main{flex:1;min-width:0}
.s-top{display:flex;align-items:center;gap:4px;overflow:hidden}
.s-name{font-size:12.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s-time{display:inline-flex;align-items:center;gap:3px;margin-left:6px;font-size:10px;color:var(--text-faint);flex-shrink:0}
.s-sub{margin-top:2px;font-size:10px;color:var(--text-faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.reorder{display:flex;gap:1px;flex-shrink:0}
.reorder button{border:0;background:none;color:var(--text-faint);cursor:pointer;display:flex;padding:1px 2px}
.reorder button:disabled{opacity:.3;cursor:default}
.note{display:flex;gap:8px;margin:1px 8px;padding:8px 8px 8px 8px;border-radius:6px;border:1px solid rgba(37,99,235,.38);background:rgba(37,99,235,.11)}
.note .ic{width:28px;height:28px;border-radius:50%;background:rgba(37,99,235,.22);color:#2563eb;display:flex;align-items:center;justify-content:center}
.note b{font-size:12.5px;font-weight:500}
.note p{margin-top:2px;font-size:10.5px;color:var(--text-muted);line-height:1.4}
.route-bar{display:flex;gap:6px;padding:10px 16px 12px;border-top:1px solid var(--border-faint);margin-top:8px}
.route-bar button{display:flex;align-items:center;justify-content:center;gap:5px;padding:6px 10px;border:1px solid var(--border-faint);border-radius:8px;background:transparent;color:var(--text-muted);font-size:11px;font-weight:600;cursor:pointer}
.route-bar .grow{flex:1}
.route-bar .on{background:var(--accent);color:#fff;border-color:var(--accent)}
.empty{padding:6px 16px 10px;font-size:11px;color:var(--text-faint)}
.p-foot{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-top:1px solid var(--border-faint);flex-shrink:0}
.p-foot span:first-child{font-size:11px;color:var(--text-faint)}
.p-foot span:last-child{font-size:13px;font-weight:600}

/* ---------- right panel ---------- */
.r-top{padding:14px 16px 10px;border-bottom:1px solid var(--border-faint);flex-shrink:0}
.r-btns{display:flex;gap:6px;margin-bottom:10px}
.r-btns button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 12px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.r-imp button{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;padding:5px 12px;border:1px dashed #cbd5e1;border-radius:8px;background:none;color:var(--text-faint);font-size:11px;font-weight:500;cursor:pointer}
.r-imp{display:flex;gap:6px;margin-bottom:10px}
.hr{height:1px;background:#e2e8f0;margin:2px 0 10px}
.all-btn{width:100%;display:flex;align-items:center;gap:8px;padding:8px 12px;margin-bottom:8px;border:1px solid var(--border-primary);border-radius:10px;background:#fff;font-size:13px;font-weight:500;cursor:default}
.all-btn span:first-child{flex:1;text-align:left}
.count{font-size:10px;font-weight:600;color:var(--text-muted);background:var(--bg-tertiary);padding:2px 7px;border-radius:999px}
.search{position:relative}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-faint);pointer-events:none}
.search input{width:100%;padding:7px 12px 7px 30px;border:1px solid var(--border-primary);border-radius:10px;font-size:12px;outline:none;background:#fff;font-family:inherit}
.filters{margin-top:6px;display:flex;gap:6px}
.cat-sel{flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;padding:6px 10px;border:1px solid var(--border-primary);border-radius:8px;background:#fff;font-size:12px;color:var(--text-primary)}
.cat-sel span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fbtn{width:30px;height:30px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:1px solid var(--border-primary);border-radius:8px;background:#fff;color:var(--text-faint);cursor:pointer}
.fbtn.on{background:#fef3c7;border-color:#f59e0b;color:#d97706}
.r-count{padding:6px 16px;flex-shrink:0}
.r-count div{text-align:center;padding:4px 10px;border:1px solid var(--border-faint);border-radius:99px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint)}
.places{flex:1;min-height:0;overflow-y:auto}
.place{display:flex;align-items:center;gap:10px;padding:9px 14px 9px 16px;cursor:pointer;border-bottom:1px solid var(--border-faint);transition:background .1s}
.place:hover{background:rgba(0,0,0,.03)}
.place.sel{background:var(--border-faint)}
.place .avatar{width:34px;height:34px}
.place .s-name{font-size:13px}
.place .s-sub{font-size:11px}
.add-mini{display:flex;align-items:center;justify-content:center;width:20px;height:20px;border:0;border-radius:6px;background:var(--bg-hover);color:var(--text-faint);cursor:pointer;flex-shrink:0}
.add-mini:hover{background:var(--accent);color:#fff}

/* ---------- category filter pill (top centre of map) ---------- */
.cat-pill{position:fixed;top:calc(var(--nav-h) + 12px);left:calc(var(--left-w) + (100vw - var(--left-w) - var(--right-w))/2);transform:translateX(-50%);z-index:60;display:inline-flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:var(--sidebar-bg);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);box-shadow:0 4px 16px rgba(0,0,0,.14);max-width:calc(100vw - var(--left-w) - var(--right-w) - 24px);overflow-x:auto;scrollbar-width:none}
.cat-pill::-webkit-scrollbar{display:none}
.cat-pill button{position:relative;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;width:34px;height:34px;border:0;border-radius:999px;background:transparent;color:var(--text-muted);cursor:pointer;transition:background .14s,color .14s}
.cat-pill button:hover{background:var(--bg-hover)}
.cat-pill button[aria-pressed="true"]{background:var(--accent);color:#fff}

/* ---------- satellite toggle ---------- */
.sat-wrap{position:fixed;bottom:20px;left:calc(var(--left-w) + 16px);z-index:60;display:inline-flex;align-items:center;padding:4px;border-radius:999px;background:rgba(255,255,255,.9);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);box-shadow:0 2px 10px rgba(0,0,0,.25)}
.sat-btn{position:relative;display:flex;align-items:center;justify-content:center;width:34px;height:34px;padding:0;border:0;border-radius:999px;background:transparent;color:#64748b;cursor:pointer;overflow:hidden;transition:background .14s,color .14s}
.sat-btn svg{width:17px;height:17px;display:block;flex:none;margin:0;position:static}
.sat-btn.active{background:var(--accent);color:#fff}

/* ---------- markers ---------- */
.mk{width:24px;height:24px;border-radius:50%;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.35);cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;transition:transform .15s}
.mk:hover{transform:scale(1.15)}
.mk.sel{width:32px;height:32px;box-shadow:0 0 0 3px rgba(15,23,42,.9),0 4px 12px rgba(0,0,0,.4);z-index:5}
.maplibregl-ctrl-attrib{font-size:10px!important}

/* ---------- info bar (element details) ---------- */
.info{position:fixed;bottom:20px;left:calc(var(--left-w) + 30px);right:calc(var(--right-w) + 30px);max-width:800px;margin:0 auto;z-index:90;display:none;background:rgba(255,255,255,.96);backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);border-radius:20px;box-shadow:0 8px 40px rgba(0,0,0,.14),0 0 0 1px rgba(0,0,0,.06);overflow:hidden;max-height:60vh;flex-direction:column}
.info.show{display:flex;animation:pop .2s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.i-head{display:flex;align-items:center;gap:14px;padding:18px 16px 14px;border-bottom:1px solid var(--border-faint);flex-shrink:0}
.i-av{position:relative;flex-shrink:0;padding:2.5px}
.i-av .avatar{width:52px;height:52px}
.i-av .rm{position:absolute;top:-1px;right:-1px;width:18px;height:18px;border-radius:50%;background:#ef4444;color:#fff;border:2px solid #fff;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.i-mid{flex:1;min-width:0}
.i-title{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.i-title strong{font-size:15px;font-weight:600}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:500;padding:2px 8px;border-radius:99px;border:1px solid}
.i-meta{display:flex;align-items:center;gap:4px;margin-top:3px;font-size:12px;color:var(--text-muted)}
.i-coord{margin-top:4px;font-size:11px;color:var(--text-faint);font-variant-numeric:tabular-nums}
.x-btn{width:28px;height:28px;border:0;border-radius:50%;background:var(--bg-hover);color:var(--text-muted);display:flex;align-items:center;justify-content:center;cursor:pointer;align-self:flex-start}
.i-body{flex:1;min-height:0;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.cost-chip{align-self:flex-start;display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;color:var(--green);background:rgba(5,150,105,.1);border:1px solid rgba(5,150,105,.25);padding:3px 10px;border-radius:99px}
.box{background:var(--bg-hover);border-radius:10px;padding:8px 12px;font-size:12px;line-height:1.5;color:var(--text-muted)}
.rating{display:flex;align-items:center;gap:8px}
.stars{display:inline-flex;gap:2px}
.stars button{border:0;background:none;padding:0;cursor:pointer;display:inline-flex;color:#facc15}
.stars button.f svg{fill:#facc15}
.rating small{font-size:11px;color:var(--text-faint)}
.files{display:flex;align-items:center;justify-content:space-between}
.files span{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--text-muted)}
.files label{display:flex;align-items:center;gap:4px;font-size:11px;padding:2px 6px;border-radius:6px;background:#e2e8f0;color:var(--text-muted);cursor:pointer}
.i-foot{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:10px 16px;border-top:1px solid var(--border-faint);flex-shrink:0}
.i-foot .sp{flex:1}
.i-foot button{display:flex;align-items:center;gap:5px;min-height:30px;padding:6px 12px;border:0;border-radius:10px;background:var(--bg-hover);color:#475569;font-size:12px;font-weight:500;cursor:pointer}
.i-foot button:hover{background:#e2e8f0}
.i-foot .danger{background:rgba(239,68,68,.08);color:#dc2626}
.i-foot .danger:hover{background:rgba(239,68,68,.16)}

/* ---------- delete dialog ---------- */
.backdrop{position:fixed;inset:0;z-index:1000;background:rgba(15,23,42,.5);display:none;align-items:center;justify-content:center;padding:16px}
.backdrop.show{display:flex}
.dialog{width:100%;max-width:384px;background:#fff;border-radius:16px;padding:24px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.dialog .row{display:flex;gap:16px;align-items:flex-start}
.dialog .warn{width:40px;height:40px;border-radius:50%;background:#fee2e2;color:#dc2626;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.dialog h3{font-size:16px;font-weight:600}
.dialog p{margin-top:4px;font-size:14px;color:var(--text-muted)}
.dialog .btns{display:flex;justify-content:flex-end;gap:12px;margin-top:24px}
.dialog .btns button{padding:8px 16px;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;border:1px solid var(--border-primary);background:#fff;color:var(--text-muted)}
.dialog .btns .del{background:#dc2626;border-color:#dc2626;color:#fff}

/* ---------- mobile ---------- */
@media(max-width:768px){
  .side.left{width:calc(100vw - 20px)}
  .side.right{width:calc(100vw - 20px)}
  .info{left:12px;right:12px}
  .sat-wrap{left:16px}
}
</style>
</head>
<body>

<!-- top nav -->
<div class="top-nav">
  <div class="tabs" id="tabs">
    <div class="pill" id="pill"></div>
    <button class="tab active"><i data-lucide="map" style="width:15px;height:15px"></i><span>Plan</span></button>
    <button class="tab"><i data-lucide="tram-front" style="width:15px;height:15px"></i><span>Transports</span></button>
    <button class="tab"><i data-lucide="ticket" style="width:15px;height:15px"></i><span>Book</span></button>
    <button class="tab"><i data-lucide="package-check" style="width:15px;height:15px"></i><span>Lists</span></button>
    <button class="tab"><i data-lucide="wallet" style="width:15px;height:15px"></i><span>Costs</span></button>
    <button class="tab"><i data-lucide="folder-open" style="width:15px;height:15px"></i><span>Files</span></button>
    <button class="tab"><i data-lucide="users" style="width:15px;height:15px"></i><span>Collab</span></button>
  </div>
</div>

<div id="map"></div>

<!-- category filter pill -->
<div class="cat-pill" id="catPill">
  <button type="button" data-cat="restaurant" aria-pressed="false" aria-label="Restaurants" title="Restaurants"><i data-lucide="utensils" style="width:16px;height:16px"></i></button>
  <button type="button" data-cat="cafe" aria-pressed="false" aria-label="Cafés" title="Cafés"><i data-lucide="coffee" style="width:16px;height:16px"></i></button>
  <button type="button" data-cat="bar" aria-pressed="false" aria-label="Bars & nightlife" title="Bars & nightlife"><i data-lucide="wine" style="width:16px;height:16px"></i></button>
  <button type="button" data-cat="hotel" aria-pressed="false" aria-label="Accommodation" title="Accommodation"><i data-lucide="bed-double" style="width:16px;height:16px"></i></button>
  <button type="button" data-cat="sight" aria-pressed="false" aria-label="Sights" title="Sights"><i data-lucide="camera" style="width:16px;height:16px"></i></button>
  <button type="button" data-cat="museum" aria-pressed="false" aria-label="Museums & culture" title="Museums & culture"><i data-lucide="landmark" style="width:16px;height:16px"></i></button>
  <button type="button" data-cat="nature" aria-pressed="false" aria-label="Nature & parks" title="Nature & parks"><i data-lucide="trees" style="width:16px;height:16px"></i></button>

<script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
<script>
/* ================= DATA ================= */
const CATS = {
  nature:{label:'Nature',color:'#22c55e',icon:'map-pin'},

};
const IMG = {
  a:'https://images.unsplash.com/photo-1476610182048-b716b8518aae?w=300&q=80',
  b:'https://images.unsplash.com/photo-1504829857797-ddff29c27927?w=300&q=80',

  e:'https://images.unsplash.com/photo-1531168556467-80aace0d0144?w=300&q=80',
  f:'https://images.unsplash.com/photo-1490650034439-fd184c3c86a5?w=300&q=80',

};
const P = [
 {id:105,name:'Blue Lagoon',cat:'nature',img:IMG.a,ll:[-22.4495,63.8803],note:'Milky blue water in a black lava field, a short drive from the airport. Touristy and still worth it once.',cost:9990,tip:'Book a slot before you fly — walk-ins are rarely possible.'},
 {id:106,name:'Reykjanes lava fields',cat:'nature',img:IMG.b,ll:[-22.70,63.85],note:'A moss-covered lava field on the way north, quiet and strange after a night without sleep.'},
 {id:107,name:'Thingvellir National Park',cat:'nature',img:IMG.b,ll:[-21.13,64.2559],note:"The rift between two continents, and the site of the world's oldest parliament."},
 {id:108,name:'Geysir geothermal area',cat:'nature',img:IMG.e,ll:[-20.3024,64.3104],note:'Strokkur goes up every six to ten minutes, about twenty metres. Stand upwind.'},
 {id:109,name:'Gullfoss',cat:'nature',img:IMG.d,ll:[-20.1199,64.3271],note:'Two drops into a canyon, with enough spray that a waterproof is not optional.'},
 {id:110,name:'Seljalandsfoss',cat:'nature',img:IMG.d,ll:[-19.9886,63.6156],note:'The one you can walk behind. You will get wet doing it.'},
 {id:111,name:'Skogafoss',cat:'nature',img:IMG.d,ll:[-19.5114,63.5321],note:'Sixty metres wide, and a staircase up the side to a view along the river.'},
 {id:112,name:'Vik i Myrdal',cat:'sight',img:IMG.c,ll:[-19.006,63.4187],note:'A village of three hundred under a red-roofed church, with the sea stacks offshore.'},
 {id:113,name:'Reynisfjara Black Sand Beach',cat:'nature',img:IMG.c,ll:[-19.0715,63.4044],note:'Basalt columns, black sand, and sneaker waves that have killed people. Stay well back from the water.'},
 {id:114,name:'Fjadrargljufur canyon',cat:'nature',img:IMG.b,ll:[-18.1717,63.7742],note:'A green gorge with a river at the bottom and a path along the rim.'},
 {id:115,name:'Jokulsarlon Glacier Lagoon',cat:'nature',img:IMG.b,ll:[-16.2306,64.0784],note:'Icebergs calving off Breidamerkurjokull and drifting out to sea.',cost:11500},
 {id:116,name:'Diamond Beach',cat:'nature',img:IMG.c,ll:[-16.1779,64.0439],note:'The ice from the lagoon washed back ashore onto black sand. Best in low sun.'},
 {id:117,name:'Djupivogur',cat:'sight',img:IMG.b,ll:[-14.2858,64.6567],note:'A fishing village with a row of thirty-four stone eggs along the harbour, one per local bird.'},
 {id:118,name:'Seydisfjordur',cat:'sight',img:IMG.b,ll:[-14.01,65.2594],note:'A rainbow-painted street leading to a blue church, at the bottom of a very long descent.'},
 {id:119,name:'Dettifoss',cat:'nature',img:IMG.e,ll:[-16.3848,65.8146],note:'The most powerful waterfall in Europe by volume. You feel it through the rock.'},
 {id:120,name:'Myvatn Nature Baths',cat:'nature',img:'https://images.unsplash.com/photo-1519098901909-b1553a1190af?w=300&q=80',ll:[-16.8495,65.6313],note:'The northern answer to the Blue Lagoon: half the price, a fifth of the people.',cost:6500},
 {id:121,name:'Hverir geothermal field',cat:'nature',img:IMG.e,ll:[-16.8081,65.6406],note:'Boiling mud and sulphur vents on an ochre plain. It smells exactly as you expect.'},
 {id:122,name:'Godafoss',cat:'nature',img:IMG.f,ll:[-17.5493,65.6828],note:'The waterfall of the gods, where the old idols were thrown in when Iceland converted.'},
 {id:123,name:'Akureyri Botanical Garden',cat:'nature',img:IMG.f,ll:[-18.0884,65.6797],note:'Every plant native to Iceland, fifty kilometres from the Arctic Circle.'},
 {id:124,name:'Kirkjufell',cat:'nature',img:IMG.b,ll:[-23.307,64.9419],note:'The arrowhead mountain with the waterfall in front, photographed more than any other rock in Iceland.'},
 {id:125,name:'Budakirkja black church',cat:'sight',img:IMG.c,ll:[-23.3806,64.8217],note:'A small black timber church alone in a lava field.'},
 {id:126,name:'Hallgrimskirkja',cat:'sight',img:IMG.b,ll:[-21.9266,64.1417],note:'The concrete church on the hill, with a lift up the tower for the best view of the coloured roofs.'},
 {id:127,name:'Braud & Co',cat:'restaurant',img:IMG.g,ll:[-21.9362,64.1436],note:'A bakery painted like a mural. The cinnamon buns come out at ten and go quickly.'}
];
const byId = id => P.find(p => p.id === id);
const DAYS = [
 {title:'Keflavik and the Blue Lagoon',date:'Sun, Sep 12, 2027',temp:'9°',w:'cloud-drizzle',cost:9990,stops:[[105,'09:00'],[106,'13:00'],[112,'15:00']],note:{t:'Lagoon before hotel',x:'It is twenty minutes from the airport and the single best way to lose a night on a plane. Book the slot before flying — walk-ins almost never work.'}},
 {title:'The Golden Circle',date:'Mon, Sep 13, 2027',temp:'7°',w:'cloud-drizzle',cost:750,stops:[[107,'10:00'],[108,'12:30'],[109,'14:30']]},
 {title:'South coast waterfalls',date:'Tue, Sep 14, 2027',temp:'9°',w:'cloud-rain',cost:900,stops:[[110,'10:00'],[111,'12:30']]},
 {title:'Black sand and basalt',date:'Wed, Sep 15, 2027',temp:'9°',w:'cloud-rain',stops:[[113,'10:00'],[114,'14:00']]},
 {title:'Glacier lagoon',date:'Thu, Sep 16, 2027',temp:'9°',w:'cloud-rain',cost:11500,stops:[[115,'10:00'],[116,'13:00']]},
 {title:'East fjords',date:'Fri, Sep 17, 2027',temp:'8°',w:'cloud-rain',stops:[[117,'12:00'],[118,'16:00']]},
 {title:'Myvatn and Dettifoss',date:'Sat, Sep 18, 2027',temp:'7°',w:'cloud-drizzle',cost:6500,stops:[[119,'10:00'],[120,'14:00'],[121,'17:00']]},
 {title:'Akureyri',date:'Sun, Sep 19, 2027',temp:'9°',w:'cloud-drizzle',stops:[[122,'10:00'],[123,'14:00']]},
 {title:'Snaefellsnes',date:'Mon, Sep 20, 2027',temp:'9°',w:'cloud-rain',stops:[[124,'11:00'],[125,'15:00']]},
 {title:'Reykjavik and home',date:'Tue, Sep 21, 2027',temp:'9°',w:'cloud-rain',cost:2200,stops:[[126,'10:00'],[127,'12:00']]}
];

/* ================= STATE ================= */
const S = {selDay:0, open:new Set([0]), selPlace:null, cats:new Set(), star:false, q:'', rating:{}, saved:new Set(), delId:null};
const $ = id => document.getElementById(id);
const icons = () => lucide.createIcons();
const isoPlaced = () => new Set(DAYS.flatMap(d => d.stops.map(s => s[0])));
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isk = n => 'ISK\u00A0' + n.toLocaleString('en-US');

function avatar(p,size){
  const c = CATS[p.cat].color;
  return `<div class="avatar" style="background:${c};${size?`width:${size}px;height:${size}px`:''}"><img alt="${esc(p.name)}" src="${p.img}" onerror="this.remove()"></div>`;
}

/* ================= MAP ================= */
const POSITRON='https://tiles.openfreemap.org/styles/positron';
const SAT={version:8,sources:{e:{type:'raster',tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],tileSize:256,attribution:'Tiles &copy; Esri'}},layers:[{id:'e',type:'raster',source:'e'}]};
const map = new maplibregl.Map({container:'map',style:POSITRON,center:[-18.6,64.9],zoom:5.8});
map.addControl(new maplibregl.NavigationControl({showCompass:false}),'top-right');
const markers = {};
function buildMarkers(){
  P.forEach(p=>{
    const el=document.createElement('div');
    el.className='mk';
    el.style.background=CATS[p.cat].color;
    el.addEventListener('click',e=>{e.stopPropagation();selectPlace(p.id)});
    markers[p.id]={el,m:new maplibregl.Marker({element:el}).setLngLat(p.ll).addTo(map)};
  });
}
function refreshMarkers(){
  const placed=new Map();
  DAYS.forEach((d,i)=>d.stops.forEach(s=>placed.set(s[0],i+1)));
  P.forEach(p=>{
    const mk=markers[p.id]; if(!mk)return;
    const visible = !S.cats.size || S.cats.has(p.cat);
    mk.el.style.display = visible ? 'flex' : 'none';
    mk.el.textContent = placed.has(p.id) ? placed.get(p.id) : '';
    mk.el.classList.toggle('sel', S.selPlace===p.id);
  });
}
map.on('click',()=>closeInfo());

/* satellite */
let sat=false;
$('satBtn').addEventListener('click',()=>{
  sat=!sat;
  map.setStyle(sat?SAT:POSITRON);
  $('satBtn').classList.toggle('active',sat);
  $('satBtn').setAttribute('aria-pressed',sat);
  $('satBtn').setAttribute('aria-label',sat?'Switch to map view':'Switch to satellite view');
});

/* ================= LEFT PANEL ================= */
function dayCost(d){return d.cost||0}
function renderDays(){
  const root=$('days');
  root.innerHTML = DAYS.map((d,i)=>{
    const open=S.open.has(i), sel=S.selDay===i;
    const stops=d.stops.map(([id,t],k)=>{
      const p=byId(id), c=CATS[p.cat];
      return `<div class="stop ${S.selPlace===id?'sel':''}" data-place="${id}">
        <div class="grip"><i data-lucide="grip-vertical" style="width:13px;height:13px"></i></div>
        ${avatar(p)}
        <div class="s-main">
          <div class="s-top"><i data-lucide="${c.icon}" style="width:10px;height:10px;color:${c.color}"></i><span class="s-name">${esc(p.name)}</span><span class="s-time"><i data-lucide="clock" style="width:9px;height:9px"></i>${t}</span></div>
          <div class="s-sub">${esc(p.note)}</div>
        </div>
        <div class="reorder">
          <button data-move="${i}:${k}:-1" ${k===0?'disabled':''}><i data-lucide="chevron-up" style="width:12px;height:12px"></i></button>
          <button data-move="${i}:${k}:1" ${k===d.stops.length-1?'disabled':''}><i data-lucide="chevron-down" style="width:12px;height:12px"></i></button>
        </div>
      </div>`;
    }).join('');
    const note = d.note ? `<div class="note"><div class="ic"><i data-lucide="info" style="width:13px;height:13px"></i></div><div><b>${esc(d.note.t)}</b><p>${esc(d.note.x)}</p></div></div>` : '';
    const route = `<div class="route-bar">
        <button class="grow" data-act="route"><i data-lucide="route" style="width:12px;height:12px"></i>Route</button>
        <button data-act="gmaps" title="Open in Google Maps"><i data-lucide="map-pin" style="width:13px;height:13px"></i></button>
        <button data-act="optimize" title="Optimize"><i data-lucide="rotate-ccw" style="width:13px;height:13px"></i></button>
        <button class="on" title="Driving"><i data-lucide="car" style="width:13px;height:13px"></i></button>
        <button title="Walking"><i data-lucide="footprints" style="width:13px;height:13px"></i></button>
      </div>`;
    return `<div class="day ${open?'open':''} ${sel?'sel':''}" data-day="${i}">
      <div class="day-h" data-head="${i}">
        <div class="badge"><div class="n">${i+1}</div><hr><div class="t"><i data-lucide="${d.w}" style="width:13px;height:13px"></i><span>Ø${d.temp}</span></div></div>
        <div class="d-info">
          <div class="d-row"><span class="d-title">${esc(d.title)}</span><span class="vsep"></span><span class="d-date">${d.date}</span></div>
          ${dayCost(d)?`<div class="d-cost">${isk(dayCost(d))}</div>`:''}
        </div>
        <div class="d-actions">
          <button data-act="transit" title="Public transit"><i data-lucide="tram-front" style="width:14px;height:14px"></i></button>
          <button data-act="transport" title="Add transport"><i data-lucide="plus" style="width:14px;height:14px"></i></button>
          <button data-act="note" title="Add note"><i data-lucide="file-text" style="width:14px;height:14px"></i></button>
          <button data-act="toggle" title="${open?'Collapse':'Expand'}"><i data-lucide="${open?'chevron-down':'chevron-right'}" style="width:15px;height:15px"></i></button>
        </div>
      </div>
      <div class="day-body">
        ${stops||'<div class="empty">No places yet — add one from the right panel.</div>'}
        ${note}
        ${sel?route:''}
      </div>
    </div>`;
  }).join('');
  $('totalCost').textContent = isk(DAYS.reduce((a,d)=>a+dayCost(d),0));
  icons();
}
$('days').addEventListener('click',e=>{
  const mv=e.target.closest('[data-move]');
  if(mv){e.stopPropagation();const[di,k,dir]=mv.dataset.move.split(':').map(Number);const a=DAYS[di].stops,j=k+dir;[a[k],a[j]]=[a[j],a[k]];renderAll();return}
  const act=e.target.closest('[data-act]');
  if(act){
    e.stopPropagation();
    const di=+act.closest('.day').dataset.day, a=act.dataset.act, d=DAYS[di];
    if(a==='toggle'){toggleDay(di)}
    else if(a==='note'){const t=prompt('Enter note:');if(t){d.note={t:'Note',x:t};S.open.add(di);renderAll()}}
    else if(a==='transport'){const t=prompt('Enter transport details:');if(t){d.note={t:'Transport',x:t};S.open.add(di);renderAll()}}
    else if(a==='gmaps'){const pts=d.stops.map(s=>byId(s[0]).ll.slice().reverse().join(',')).join('/');window.open('https://www.google.com/maps/dir/'+pts,'_blank')}
    else if(a==='route'){fitDay(di)}
    else if(a==='optimize'){alert('Route optimised.')}
    return;
  }
  const stop=e.target.closest('[data-place]');
  if(stop){selectPlace(+stop.dataset.place);return}
  const head=e.target.closest('[data-head]');
  if(head){const di=+head.dataset.head;S.selDay=di;toggleDay(di,true)}
});
function toggleDay(i,keepSel){
  if(S.open.has(i)&&!(keepSel&&S.selDay!==i)) S.open.delete(i); else S.open.add(i);
  if(!keepSel) S.selDay=i;
  renderDays();refreshMarkers();
}
function fitDay(i){
  const pts=DAYS[i].stops.map(s=>byId(s[0]).ll);
  if(!pts.length)return;
  const b=new maplibregl.LngLatBounds(pts[0],pts[0]);pts.forEach(p=>b.extend(p));
  map.fitBounds(b,{padding:120,maxZoom:10});
}
let allOpen=false;
$('expandAll').addEventListener('click',()=>{
  allOpen=!allOpen;
  S.open = allOpen ? new Set(DAYS.map((_,i)=>i)) : new Set();
  renderDays();
});

/* ================= RIGHT PANEL ================= */
function filteredPlaces(){
  const q=S.q.toLowerCase();
  return P.filter(p=>
    (!S.cats.size||S.cats.has(p.cat)) &&
    (!q||p.name.toLowerCase().includes(q)||p.note.toLowerCase().includes(q)) &&
    (!S.star||(S.rating[p.id]||0)>0)
  );
}
function renderPlaces(){
  const placed=isoPlaced(), list=filteredPlaces();
  $('places').innerHTML=list.map(p=>{
    const c=CATS[p.cat];
    return `<div class="place ${S.selPlace===p.id?'sel':''}" data-place="${p.id}">
      ${avatar(p)}
      <div class="s-main">
        <div class="s-top"><i data-lucide="${c.icon}" style="width:11px;height:11px;color:${c.color}"></i><span class="s-name">${esc(p.name)}</span></div>
        <div class="s-sub">${esc(p.note)}</div>
      </div>
      ${placed.has(p.id)?'':`<button class="add-mini" data-add="${p.id}" title="Add to day"><i data-lucide="plus" style="width:12px;height:12px"></i></button>`}
    </div>`;
  }).join('') || '<div class="empty" style="padding:20px;text-align:center">No places match.</div>';
  $('badgeCount').textContent=P.length;
  $('midCount').textContent=list.length+' places';
  const n=S.cats.size;
  $('catLabel').textContent = n===0?'All Categories':n===1?CATS[[...S.cats][0]].label:n+' categories';
  icons();
}
$('places').addEventListener('click',e=>{
  const add=e.target.closest('[data-add]');
  if(add){e.stopPropagation();addToDay(+add.dataset.add);return}
  const row=e.target.closest('[data-place]');
  if(row)selectPlace(+row.dataset.place);
});
function addToDay(id,day=S.selDay){
  if(isoPlaced().has(id))return;
  const stops=DAYS[day].stops, last=stops.length?stops[stops.length-1][1]:'08:00';
  const h=Math.min(21,parseInt(last)+2);
  stops.push([id,String(h).padStart(2,'0')+':00']);
  S.open.add(day);renderAll();
}
$('toDay').addEventListener('click',()=>{
  if(S.selPlace==null){alert('Select a place first.');return}
  if(isoPlaced().has(S.selPlace)){alert('This place is already in your plan.');return}
  addToDay(S.selPlace);
});
$('newPlace').addEventListener('click',()=>{
  const name=prompt('Place name:');if(!name)return;
  const c=map.getCenter();
  const p={id:Date.now(),name,cat:'sight',img:IMG.b,ll:[c.lng,c.lat],note:'New place'};
  P.unshift(p);
  const el=document.createElement('div');el.className='mk';el.style.background=CATS.sight.color;
  el.addEventListener('click',e=>{e.stopPropagation();selectPlace(p.id)});
  markers[p.id]={el,m:new maplibregl.Marker({element:el}).setLngLat(p.ll).addTo(map)};
  renderAll();selectPlace(p.id);
});
$('searchInput').addEventListener('input',e=>{S.q=e.target.value;renderPlaces()});
$('starBtn').addEventListener('click',()=>{S.star=!S.star;$('starBtn').classList.toggle('on',S.star);renderPlaces()});
$('selBtn').addEventListener('click',()=>$('selBtn').classList.toggle('on'));

/* category pill */
$('catPill').addEventListener('click',e=>{
  const b=e.target.closest('button[data-cat]');if(!b)return;
  const c=b.dataset.cat, on=!S.cats.has(c);
  on?S.cats.add(c):S.cats.delete(c);
  b.setAttribute('aria-pressed',on);
  renderPlaces();refreshMarkers();
});

/* ================= INFO BAR ================= */
function selectPlace(id){
  S.selPlace=id;
  const p=byId(id);
  map.flyTo({center:p.ll,zoom:Math.max(map.getZoom(),9),speed:1.2});
  const di=DAYS.findIndex(d=>d.stops.some(s=>s[0]===id));
  if(di>=0){S.selDay=di;S.open.add(di)}
  renderAll();
  showInfo(id);
}
function showInfo(id){
  const p=byId(id), c=CATS[p.cat];
  const di=DAYS.findIndex(d=>d.stops.some(s=>s[0]===id));
  const stop=di>=0?DAYS[di].stops.find(s=>s[0]===id):null;
  const r=S.rating[id]||0;
  const stars=[1,2,3,4,5].map(n=>`<button type="button" data-star="${n}" aria-label="${n}" class="${n<=r?'f':''}"><i data-lucide="star" style="width:16px;height:16px"></i></button>`).join('');
  $('info').innerHTML=`
    <div class="i-head">
      <div class="i-av">${avatar(p,52)}<button class="rm" data-i="img" aria-label="Remove image"><i data-lucide="x" style="width:10px;height:10px"></i></button></div>
      <div class="i-mid">
        <div class="i-title"><strong>${esc(p.name)}</strong><span class="tag" style="color:${c.color};background:${c.color}18;border-color:${c.color}30"><i data-lucide="${c.icon}" style="width:10px;height:10px"></i>${c.label}</span></div>
        ${stop?`<div class="i-meta"><i data-lucide="clock" style="width:10px;height:10px"></i>${stop[1]}</div>`:''}
        <div class="i-coord">${p.ll[1].toFixed(6)}, ${p.ll[0].toFixed(6)}</div>
      </div>
      <button class="x-btn" data-i="close" aria-label="Close"><i data-lucide="x" style="width:14px;height:14px"></i></button>
    </div>
    <div class="i-body">
      ${p.cost?`<span class="cost-chip"><i data-lucide="banknote" style="width:12px;height:12px"></i>${isk(p.cost)}</span>`:''}
      <div class="box rating"><div class="stars" role="radiogroup" aria-label="Your rating">${stars}</div><small>${r?r+' / 5':'Not rated yet'}</small></div>
      <div class="box">${esc(p.note)}</div>
      ${p.tip?`<div class="box">${esc(p.tip)}</div>`:''}
      <div class="box files"><span><i data-lucide="file-text" style="width:13px;height:13px"></i>Files</span><label><input type="file" multiple hidden><i data-lucide="upload" style="width:11px;height:11px"></i> Upload</label></div>
    </div>
    <div class="i-foot">
      ${di>=0?`<button data-i="remove"><i data-lucide="minus" style="width:13px;height:13px"></i>Remove from Day</button>`:`<button data-i="addday"><i data-lucide="calendar-plus" style="width:13px;height:13px"></i>Add to Day</button>`}
      <button data-i="save"><i data-lucide="bookmark" style="width:13px;height:13px"></i>${S.saved.has(id)?'Saved':'Save to Collection'}</button>
      <button data-i="nav"><i data-lucide="navigation" style="width:13px;height:13px"></i>Navigation</button>
      <div class="sp"></div>
      <button data-i="edit"><i data-lucide="pen" style="width:13px;height:13px"></i>Edit</button>
      <button class="danger" data-i="delete"><i data-lucide="trash-2" style="width:13px;height:13px"></i>Delete</button>
    </div>`;
  $('info').classList.add('show');
  icons();
}
function closeInfo(){
  $('info').classList.remove('show');
  if(S.selPlace!=null){S.selPlace=null;renderAll()}
}
$('info').addEventListener('click',e=>{
  const id=S.selPlace; if(id==null)return;
  const st=e.target.closest('[data-star]');
  if(st){const n=+st.dataset.star;S.rating[id]=S.rating[id]===n?0:n;showInfo(id);renderPlaces();return}
  const b=e.target.closest('[data-i]');if(!b)return;
  const p=byId(id);
  switch(b.dataset.i){
    case 'close': closeInfo();break;
    case 'img': p.img='';showInfo(id);renderAll();break;
    case 'remove': DAYS.forEach(d=>d.stops=d.stops.filter(s=>s[0]!==id));renderAll();showInfo(id);break;
    case 'addday': addToDay(id);showInfo(id);break;
    case 'save': S.saved.has(id)?S.saved.delete(id):S.saved.add(id);showInfo(id);break;
    case 'nav': window.open(`https://www.google.com/maps/dir/?api=1&destination=${p.ll[1]},${p.ll[0]}`,'_blank');break;
    case 'edit': {const t=prompt('Edit description:',p.note);if(t!==null){p.note=t;renderAll();showInfo(id)}break}
    case 'delete': S.delId=id;$('delModal').classList.add('show');break;
  }
});
$('delCancel').addEventListener('click',()=>$('delModal').classList.remove('show'));
$('delOk').addEventListener('click',()=>{
  const id=S.delId;
  DAYS.forEach(d=>d.stops=d.stops.filter(s=>s[0]!==id));
  const i=P.findIndex(p=>p.id===id);if(i>=0)P.splice(i,1);
  if(markers[id]){markers[id].m.remove();delete markers[id]}
  $('delModal').classList.remove('show');
  S.selPlace=null;$('info').classList.remove('show');renderAll();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('delModal').classList.remove('show');closeInfo()}});

/* ================= SIDEBAR LAYOUT ================= */
const L={open:true,w:340}, R={open:true,w:300};
const mobile=()=>innerWidth<=768;
function layout(){
  const root=document.documentElement.style;
  root.setProperty('--lw',(mobile()?innerWidth-20:L.w)+'px');
  root.setProperty('--rw',(mobile()?innerWidth-20:R.w)+'px');
  $('leftSide').classList.toggle('collapsed',!L.open);
  $('rightSide').classList.toggle('collapsed',!R.open);
  $('leftOpen').classList.toggle('show',!L.open);
  $('rightOpen').classList.toggle('show',!R.open);
  const lw=mobile()?0:(L.open?L.w+20:0), rw=mobile()?0:(R.open?R.w+20:0);
  root.setProperty('--left-w',lw+'px');
  root.setProperty('--right-w',rw+'px');
}
$('leftCollapse').onclick=()=>{L.open=false;layout();setTimeout(()=>map.resize(),50)};
$('rightCollapse').onclick=()=>{R.open=false;layout();setTimeout(()=>map.resize(),50)};
$('leftOpen').onclick=()=>{L.open=true;if(mobile())R.open=false;layout()};
$('rightOpen').onclick=()=>{R.open=true;if(mobile())L.open=false;layout()};
addEventListener('resize',layout);

function makeResizer(el,state,side,min,max){
  el.addEventListener('pointerdown',e=>{
    e.preventDefault();el.classList.add('drag');el.setPointerCapture(e.pointerId);
    const move=ev=>{
      const w=side==='left'?ev.clientX-10:innerWidth-10-ev.clientX;
      state.w=Math.max(min,Math.min(max,Math.round(w)));layout();
    };
    const up=()=>{el.classList.remove('drag');el.removeEventListener('pointermove',move);el.removeEventListener('pointerup',up)};
    el.addEventListener('pointermove',move);el.addEventListener('pointerup',up);
  });
}
makeResizer($('leftResizer'),L,'left',280,520);
makeResizer($('rightResizer'),R,'right',260,460);

/* ================= NAV PILL ================= */
const tabs=$('tabs'),pill=$('pill'),tabBtns=tabs.querySelectorAll('.tab');
function movePill(b){pill.style.left=(b.offsetLeft)+'px';pill.style.width=b.offsetWidth+'px'}
tabBtns.forEach(b=>b.addEventListener('click',()=>{tabBtns.forEach(x=>x.classList.remove('active'));b.classList.add('active');movePill(b)}));

/* ================= INIT ================= */
function renderAll(){renderDays();renderPlaces();refreshMarkers()}
icons();
layout();
buildMarkers();
renderAll();
setTimeout(()=>movePill(tabs.querySelector('.tab.active')),60);
addEventListener('load',()=>movePill(tabs.querySelector('.tab.active')));
</script>
</body>
