<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel Lists & Tasks Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --bg-primary: #ffffff;
      --bg-surface: #f8fafc;
      --bg-tertiary: #f1f5f9;
      --bg-card: #ffffff;
      --bg-hover: #f1f5f9;
      --bg-input: #f8fafc;
      --text-primary: #0f172a;
      --text-secondary: #334155;
      --text-muted: #64748b;
      --text-faint: #94a3b8;
      --border-primary: #e2e8f0;
      --border-secondary: #cbd5e1;
      --border-faint: #f1f5f9;
      --accent: #0f172a;
      --accent-text: #ffffff;
      --nav-h: 44px;
      --fs-scale-title: 1;
      --fs-scale-subtitle: 1;
      --fs-scale-body: 1;
      --fs-scale-caption: 1;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #ffffff;
      color: var(--text-primary);
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 99px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    /* Modal animation */
    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.96) translateY(-8px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .modal-enter {
      animation: modalIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="bg-white min-h-screen flex flex-col">

  <!-- TOP NAVIGATION BAR -->
  <header class="fixed top-0 left-0 right-0 z-40 bg-white/80 backdrop-blur-md border-b border-slate-100 h-[44px] flex items-center justify-center px-3">
    <div class="relative flex items-center gap-0.5 overflow-x-auto no-scrollbar">
      <!-- Animated Indicator Pill -->
      <div id="nav-indicator" class="absolute top-1/2 -translate-y-1/2 h-[30px] bg-slate-900 rounded-full transition-all duration-300 ease-[cubic-bezier(0.77,0,0.175,1)] pointer-events-none z-0"></div>

      <button type="button" onclick="switchMainTab('plan', this)" class="nav-btn relative z-10 px-3.5 py-1.5 rounded-full text-[13px] font-medium transition-colors text-slate-500 hover:text-slate-900 flex items-center gap-1.5 whitespace-nowrap">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"></polygon><line x1="9" x2="9" y1="3" y2="18"></line><line x1="15" x2="15" y1="6" y2="21"></line></svg>
        <span>Plan</span>
      </button>

      <button type="button" onclick="switchMainTab('transports', this)" class="nav-btn relative z-10 px-3.5 py-1.5 rounded-full text-[13px] font-medium transition-colors text-slate-500 hover:text-slate-900 flex items-center gap-1.5 whitespace-nowrap">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="16" height="16" x="4" y="3" rx="2"></rect><path d="M4 11h16"></path><path d="M12 3v8"></path><path d="m8 19-2 3"></path><path d="m18 22-2-3"></path><path d="M8 15h0"></path><path d="M16 15h0"></path></svg>
        <span>Transports</span>
      </button>

      <button type="button" onclick="switchMainTab('book', this)" class="nav-btn relative z-10 px-3.5 py-1.5 rounded-full text-[13px] font-medium transition-colors text-slate-500 hover:text-slate-900 flex items-center gap-1.5 whitespace-nowrap">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"></path><path d="M13 5v2"></path><path d="M13 17v2"></path><path d="M13 11v2"></path></svg>
        <span>Book</span>
      </button>

      <button type="button" id="tab-lists-btn" onclick="switchMainTab('lists', this)" class="nav-btn relative z-10 px-3.5 py-1.5 rounded-full text-[13px] font-semibold text-white transition-colors flex items-center gap-1.5 whitespace-nowrap">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 16 2 2 4-4"></path><path d="M21 10V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l2-1.14"></path><path d="m7.5 4.27 9 5.15"></path><polyline points="3.29 7 12 12 20.71 7"></polyline><line x1="12" x2="12" y1="22" y2="12"></line></svg>
        <span>Lists</span>
      </button>

      <button type="button" onclick="switchMainTab('costs', this)" class="nav-btn relative z-10 px-3.5 py-1.5 rounded-full text-[13px] font-medium transition-colors text-slate-500 hover:text-slate-900 flex items-center gap-1.5 whitespace-nowrap">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"></path><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"></path><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"></path></svg>
        <span>Costs</span>
      </button>

      <button type="button" onclick="switchMainTab('files', this)" class="nav-btn relative z-10 px-3.5 py-1.5 rounded-full text-[13px] font-medium transition-colors text-slate-500 hover:text-slate-900 flex items-center gap-1.5 whitespace-nowrap">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"></path></svg>
        <span>Files</span>
      </button>

      <button type="button" onclick="switchMainTab('collab', this)" class="nav-btn relative z-10 px-3.5 py-1.5 rounded-full text-[13px] font-medium transition-colors text-slate-500 hover:text-slate-900 flex items-center gap-1.5 whitespace-nowrap">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
        <span>Collab</span>
      </button>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="pt-[44px] flex-1 flex flex-col">
    
    <!-- SUB HEADER TOOLBAR -->
    <div class="px-4 sm:px-7 pt-6">
      <div class="bg-slate-50 rounded-[18px] p-3.5 pl-5 sm:pl-6 flex items-center gap-4 flex-wrap">
        <h2 class="m-0 text-[18px] font-semibold tracking-tight text-slate-900 shrink-0">Lists</h2>
        <div class="hidden md:block w-px h-[22px] bg-slate-200 shrink-0"></div>
        
        <!-- Mode Switcher Tabs (Packing List vs To-Do) -->
        <div class="inline-flex gap-1 flex-wrap flex-1 min-w-0">
          <button type="button" id="btn-mode-packing" onclick="switchListMode('packing')" class="appearance-none border-none cursor-pointer font-inherit inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-[13px] whitespace-nowrap font-semibold bg-white text-slate-900 shadow-sm transition-all">
            <svg class="w-3.5 h-3.5 text-slate-900" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m16 16 2 2 4-4"></path><path d="M21 10V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l2-1.14"></path><path d="m7.5 4.27 9 5.15"></path><polyline points="3.29 7 12 12 20.71 7"></polyline><line x1="12" x2="12" y1="22" y2="12"></line></svg>
            <span class="hidden sm:inline">Packing List</span>
            <span id="packing-badge-count" class="text-[10px] font-semibold px-1.5 py-0.5 rounded-full min-w-[16px] text-center bg-slate-100 text-slate-500">12</span>
          </button>

          <button type="button" id="btn-mode-todo" onclick="switchListMode('todo')" class="appearance-none border-none cursor-pointer font-inherit inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-[13px] whitespace-nowrap font-normal bg-transparent text-slate-500 transition-all hover:text-slate-900">
            <svg class="w-3.5 h-3.5 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="6" height="6" rx="1"></rect><path d="m3 17 2 2 4-4"></path><path d="M13 6h8"></path><path d="M13 12h8"></path><path d="M13 18h8"></path></svg>
            <span class="hidden sm:inline">To-Do</span>
            <span id="todo-badge-count" class="text-[10px] font-semibold px-1.5 py-0.5 rounded-full min-w-[16px] text-center bg-black/5 text-slate-500">5</span>
          </button>
        </div>

        <!-- Action Button -->
        <div class="ml-auto shrink-0 flex items-center gap-2">
          <button type="button" id="btn-main-action" onclick="handleMainAction()" class="inline-flex items-center gap-1.5 px-3.5 py-2 hover:opacity-90 bg-slate-900 text-white rounded-xl text-[13px] font-medium transition-opacity">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" x2="12" y1="15" y2="3"></line></svg>
            <span id="main-action-text" class="hidden sm:inline">Import</span>
          </button>
        </div>
      </div>
    </div>

    <!-- VIEW 1: PACKING LIST DASHBOARD -->
    <div id="view-packing" class="px-4 sm:px-7 pt-4 pb-12 flex-1 flex flex-col">
      <!-- Progress Bar Section -->
      <div class="py-2 shrink-0">
        <div class="hidden sm:flex items-center gap-3.5 my-3">
          <div class="flex items-baseline gap-2 shrink-0">
            <div class="flex items-baseline">
              <span id="packing-completed-val" class="text-[22px] font-bold text-slate-900 tabular-nums leading-none">0</span>
              <span id="packing-total-val" class="text-[14px] font-medium text-slate-400 tabular-nums leading-none ml-0.5">/12</span>
            </div>
            <span id="packing-percent-val" class="text-[11px] font-semibold px-1.5 py-0.5 rounded-full bg-slate-100 text-slate-600 tabular-nums">0%</span>
          </div>
          <div class="flex-1 h-2 bg-slate-100 rounded-full overflow-hidden relative">
            <div id="packing-progress-bar" class="h-full rounded-full bg-slate-900 transition-all duration-500 ease-out w-0 relative">
              <div class="absolute inset-0 bg-gradient-to-b from-white/20 to-transparent rounded-full pointer-events-none"></div>
            </div>
          </div>
        </div>

        <button type="button" onclick="promptAddCategory()" class="flex items-center gap-1.5 w-full py-2 px-3.5 rounded-xl border border-transparent hover:border-slate-200 text-[13px] text-slate-400 font-normal hover:text-slate-600 transition-colors">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 10v6"></path><path d="M9 13h6"></path><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"></path></svg>
          Add list
        </button>
      </div>

      <!-- Filters Toolbar -->
      <div class="flex items-center gap-1.5 pt-2 flex-wrap shrink-0">
        <button type="button" onclick="setPackingFilter('shared')" class="inline-flex items-center gap-1.5 h-[30px] px-3 rounded-full border border-slate-200 text-[12.5px] font-semibold text-slate-700 bg-transparent hover:bg-slate-50 transition-colors">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
          Shared
          <span class="text-[10px] font-bold rounded-full px-1.5 bg-slate-100 text-slate-400">12</span>
        </button>

        <button type="button" onclick="setPackingFilter('my')" class="inline-flex items-center gap-1.5 h-[30px] px-3 rounded-full border border-slate-900 text-[12.5px] font-semibold bg-slate-900 text-white transition-colors">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="5"></circle><path d="M20 21a8 8 0 0 0-16 0"></path></svg>
          My list
          <span class="text-[10px] font-bold rounded-full px-1.5 bg-white text-slate-900">0</span>
        </button>

        <span class="self-stretch w-px bg-slate-200 my-1 mx-1"></span>

        <button type="button" id="packing-status-all" onclick="setPackingStatusFilter('all')" class="inline-flex items-center h-[30px] px-3 rounded-full border border-transparent text-[12.5px] font-semibold bg-slate-900 text-white transition-colors">All</button>
        <button type="button" id="packing-status-open" onclick="setPackingStatusFilter('open')" class="inline-flex items-center h-[30px] px-3 rounded-full border border-transparent text-[12.5px] font-normal text-slate-500 hover:text-slate-800 transition-colors">Open</button>
        <button type="button" id="packing-status-done" onclick="setPackingStatusFilter('done')" class="inline-flex items-center h-[30px] px-3 rounded-full border border-transparent text-[12.5px] font-normal text-slate-500 hover:text-slate-800 transition-colors">Done</button>
      </div>

      <!-- Category Cards Grid -->
      <div id="packing-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
        <!-- Dynamic content -->
      </div>
    </div>

    <!-- VIEW 2: TO-DO DASHBOARD -->
    <div id="view-todo" class="px-4 sm:px-7 pt-4 pb-6 flex-1 hidden flex-col">
      <div class="flex flex-col md:flex-row h-full min-h-[500px]">
        
        <!-- Left Sidebar Filter -->
        <div class="w-full md:w-[220px] shrink-0 border-b md:border-b-0 md:border-r border-slate-100 pb-4 md:pb-0 md:pr-3 flex flex-col gap-0.5 overflow-y-auto">
          <!-- Small Progress Widget -->
          <div class="mb-3 p-3.5 rounded-2xl bg-slate-50 border border-slate-200/60 shadow-xs">
            <div class="flex items-baseline gap-1 mb-2">
              <span id="todo-percent-val" class="text-[18px] font-bold text-slate-900 leading-none tracking-tight">0%</span>
            </div>
            <div class="h-1 bg-slate-200 rounded-full overflow-hidden mb-1.5">
              <div id="todo-progress-bar" class="h-full bg-emerald-500 rounded-full transition-all duration-300 w-0"></div>
            </div>
            <div id="todo-completed-text" class="text-[11px] text-slate-400">0 / 5 completed</div>
          </div>

          <div class="text-[10px] font-semibold text-slate-400 px-3 pt-2 pb-1 uppercase tracking-wider">Tasks</div>
          
          <button type="button" onclick="setTodoTaskFilter('all')" class="todo-nav-item active flex items-center gap-2 w-full px-3 py-1.5 rounded-lg text-[13px] bg-slate-100 font-semibold text-slate-900 transition-colors text-left">
            <svg class="w-3.5 h-3.5 opacity-70" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"></polyline><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"></path></svg>
            <span class="flex-1">All</span>
            <span id="todo-sidebar-count-all" class="text-[11px] text-slate-400 bg-slate-200/50 rounded-full px-1.5 min-w-[20px] text-center">5</span>
          </button>

          <button type="button" onclick="setTodoTaskFilter('my')" class="todo-nav-item flex items-center gap-2 w-full px-3 py-1.5 rounded-lg text-[13px] text-slate-600 font-normal hover:bg-slate-50 transition-colors text-left">
            <svg class="w-3.5 h-3.5 opacity-70" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <span class="flex-1">My Tasks</span>
          </button>

          <button type="button" onclick="setTodoTaskFilter('overdue')" class="todo-nav-item flex items-center gap-2 w-full px-3 py-1.5 rounded-lg text-[13px] text-slate-600 font-normal hover:bg-slate-50 transition-colors text-left">
            <svg class="w-3.5 h-3.5 opacity-70" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" x2="12" y1="8" y2="12"></line><line x1="12" x2="12.01" y1="16" y2="16"></line></svg>
            <span class="flex-1">Overdue</span>
          </button>

          <button type="button" onclick="setTodoTaskFilter('done')" class="todo-nav-item flex items-center gap-2 w-full px-3 py-1.5 rounded-lg text-[13px] text-slate-600 font-normal hover:bg-slate-50 transition-colors text-left">
            <svg class="w-3.5 h-3.5 opacity-70" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 7 17l-5-5"></path><path d="m22 10-7.5 7.5L13 16"></path></svg>
            <span class="flex-1">Done</span>
          </button>

          <div class="text-[10px] font-semibold text-slate-400 px-3 pt-4 pb-1 uppercase tracking-wider">Sort by</div>
          
          <button type="button" onclick="sortTodoTasks('priority')" class="flex items-center gap-2 w-full px-3 py-1.5 rounded-lg text-[13px] text-slate-600 font-normal hover:bg-slate-50 transition-colors text-left">
            <svg class="w-3.5 h-3.5 opacity-70" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path><line x1="4" x2="4" y1="22" y2="15"></line></svg>
            <span class="flex-1">Priority</span>
          </button>

          <button type="button" onclick="sortTodoTasks('date')" class="flex items-center gap-2 w-full px-3 py-1.5 rounded-lg text-[13px] text-slate-600 font-normal hover:bg-slate-50 transition-colors text-left">
            <svg class="w-3.5 h-3.5 opacity-70" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 2v4"></path><path d="M16 2v4"></path><rect width="18" height="18" x="3" y="4" rx="2"></rect><path d="M3 10h18"></path></svg>
            <span class="flex-1">Due date</span>
          </button>

          <div class="text-[10px] font-semibold text-slate-400 px-3 pt-4 pb-1 uppercase tracking-wider">Lists</div>
          <button type="button" onclick="openNewTaskModal()" class="flex items-center gap-1.5 px-3 py-1.5 text-[12px] text-slate-400 hover:text-slate-600 transition-colors w-full text-left">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>
            Add list
          </button>
        </div>

        <!-- Task Items List Center Pane -->
        <div class="flex-1 flex flex-col min-w-0 border-r border-slate-100">
          <div class="px-5 py-3 border-b border-slate-100 flex items-center gap-2.5">
            <h2 id="todo-view-title" class="m-0 text-[22px] font-bold text-slate-900 tracking-tight">All</h2>
            <span id="todo-view-count" class="text-[13px] text-slate-400 bg-slate-100 rounded-md px-2 py-0.5 font-semibold">5</span>
          </div>

          <div id="todo-tasks-container" class="flex-1 overflow-y-auto py-1">
            <!-- Dynamic tasks render here -->
          </div>
        </div>

        <!-- Right Side Detail Drawer (Hidden until a task is explicitly clicked) -->
        <div id="todo-detail-pane" class="w-full md:w-[320px] shrink-0 hidden flex-col bg-white border-l border-slate-100">
          <div class="flex items-center justify-between px-5 py-3 border-b border-slate-100">
            <span class="text-[14px] font-bold text-slate-900">Task</span>
            <button type="button" onclick="closeTaskDetailPane()" class="p-1 text-slate-400 hover:text-slate-600 rounded">
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
            </button>
          </div>

          <div class="flex-1 overflow-y-auto p-5 flex flex-col gap-3.5">
            <div>
              <input id="detail-task-title" type="text" placeholder="Task name" class="w-full text-[15px] font-semibold py-1 border-none bg-transparent text-slate-900 outline-none" oninput="markTaskDetailDirty()">
            </div>

            <div>
              <label class="block text-xs font-medium text-slate-500 mb-1">Description</label>
              <textarea id="detail-task-desc" rows="4" placeholder="Description (optional)" class="w-full text-[13px] p-2.5 border border-slate-200 rounded-lg bg-white text-slate-900 font-inherit resize-y min-h-[80px]" oninput="markTaskDetailDirty()"></textarea>
            </div>

            <div>
              <label class="block text-xs font-medium text-slate-500 mb-1">Priority</label>
              <div class="flex gap-1">

                </button>
                <button type="button" onclick="deletePackingItem('${cat.id}', ${item.id})" title="Delete" class="p-1 rounded text-slate-400 hover:text-red-500">
                  <svg class="w-3.2 h-3.2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path></svg>
                </button>
              </div>
            </div>
          `;
        });

        // Inline Add Item UI
        let addControlHtml = '';
        if (activeInlineAddCatId === cat.id) {
          addControlHtml = `
            <div class="flex items-center gap-1.5 p-1 px-2">
              <input id="inline-item-input-${cat.id}" placeholder="Item name..." value="" oninput="validateInlineInput('${cat.id}')" onkeydown="if(event.key==='Enter') submitInlineItem('${cat.id}')" class="flex-1 px-2.5 py-1.5 rounded-lg border border-slate-200 text-[12.5px] outline-none text-slate-900 bg-slate-50">
              <button id="inline-item-submit-${cat.id}" type="button" disabled onclick="submitInlineItem('${cat.id}')" class="p-1.5 rounded-lg bg-slate-200 text-slate-400 cursor-default flex items-center justify-center transition-colors">
                <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>
              </button>
              <button type="button" onclick="cancelInlineAdd()" class="p-1 text-slate-400 hover:text-slate-600">
                <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
              </button>
            </div>
          `;
        } else {
          addControlHtml = `
            <button type="button" onclick="showInlineAdd('${cat.id}')" class="flex items-center gap-1.5 p-1.5 px-2.5 my-0.5 text-[12px] text-slate-400 hover:text-slate-600 transition-colors w-full text-left">
              <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg> Add item
            </button>
          `;
        }

        catCard.innerHTML = `
          <div class="flex items-center gap-2 p-2.5 px-3 border-b border-slate-100">
            <button type="button" class="text-slate-400 hover:text-slate-600 p-0.5">
              <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"></path></svg>
            </button>
            <span class="w-2.5 h-2.5 rounded-full shrink-0" style="background-color: ${cat.color}"></span>
            <span class="text-[12.5px] font-bold text-slate-600 uppercase tracking-wider">${cat.title}</span>
            <span class="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-slate-100 text-slate-500 ml-auto">${catDone}/${catTotal}</span>
            <button type="button" class="p-1 text-slate-400 hover:text-slate-600">
              <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle><circle cx="5" cy="12" r="1"></circle></svg>
            </button>
          </div>
          <div class="p-1">
            ${itemsHtml}
            ${addControlHtml}
          </div>
        `;

        grid.appendChild(catCard);
      });

      // Calculate and update packing completion percentage bar
      const pct = totalItems > 0 ? Math.round((completedItems / totalItems) * 100) : 0;
      document.getElementById('packing-completed-val').textContent = completedItems;
      document.getElementById('packing-total-val').textContent = `/${totalItems}`;
      document.getElementById('packing-percent-val').textContent = `${pct}%`;
      document.getElementById('packing-progress-bar').style.width = `${pct}%`;
      document.getElementById('packing-badge-count').textContent = totalItems;
    }

    function togglePackingItem(catId, itemId) {
      const cat = packingCategories.find(c => c.id === catId);
      if (cat) {
        const item = cat.items.find(i => i.id === itemId);
        if (item) {
          item.checked = !item.checked;
          renderPackingList(); // Re-render to update checkbox state & completion meter
        }
      }
    }

    function updateItemQty(catId, itemId, value) {
      const cat = packingCategories.find(c => c.id === catId);
      if (cat) {
        const item = cat.items.find(i => i.id === itemId);
        if (item) {
          item.qty = value || 1;
        }
      }
    }

    function deletePackingItem(catId, itemId) {
      const cat = packingCategories.find(c => c.id === catId);
      if (cat) {
        cat.items = cat.items.filter(i => i.id !== itemId);
        renderPackingList();
      }
    }

    function showInlineAdd(catId) {
      activeInlineAddCatId = catId;
      renderPackingList();
      setTimeout(() => {
        const inp = document.getElementById(`inline-item-input-${catId}`);
        if (inp) inp.focus();
      }, 50);
    }

    function cancelInlineAdd() {
      activeInlineAddCatId = null;
      renderPackingList();
    }

    function validateInlineInput(catId) {
      const inp = document.getElementById(`inline-item-input-${catId}`);
      const btn = document.getElementById(`inline-item-submit-${catId}`);
      if (inp && btn) {
        if (inp.value && inp.value.trim().length > 0) {
          btn.disabled = false;
          btn.className = "p-1.5 rounded-lg bg-slate-900 text-white cursor-pointer flex items-center justify-center transition-colors";
        } else {
          btn.disabled = true;
          btn.className = "p-1.5 rounded-lg bg-slate-200 text-slate-400 cursor-default flex items-center justify-center transition-colors";
        }
      }
    }

    function submitInlineItem(catId) {
      const inp = document.getElementById(`inline-item-input-${catId}`);
      if (inp && inp.value && inp.value.trim()) {
        const cat = packingCategories.find(c => c.id === catId);
        if (cat) {
          cat.items.push({
            id: Date.now(),
            text: inp.value.trim(),
            qty: 1,
            weight: '',
            checked: false,
            user: 'Demo User'
          });
          activeInlineAddCatId = null;
          renderPackingList();
        }
      }
    }

    function promptAddCategory() {
      const name = prompt("Enter new list category title:");
      if (name && name.trim()) {
        packingCategories.push({
          id: name.toLowerCase().replace(/\s+/g, '-'),
          title: name.toUpperCase(),
          color: '#6366f1',
          items: []
        });
        renderPackingList();
      }
    }

    function renderTodoList() {
      const container = document.getElementById('todo-tasks-container');
      container.innerHTML = '';

      let completedCount = 0;

      todoTasks.forEach(task => {
        if (task.completed) completedCount++;

        const isSelected = task.id === selectedTaskId;
        const row = document.createElement('div');
        row.className = `flex items-center gap-2.5 px-5 py-2.5 border-b border-slate-100 cursor-pointer transition-colors ${isSelected ? 'bg-slate-100/70' : 'hover:bg-slate-50'}`;
        row.onclick = () => selectTaskForDetail(task.id);

        row.innerHTML = `
          <div class="cursor-grab text-slate-300 hover:text-slate-500 shrink-0 -ml-1">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="12" r="1"></circle><circle cx="9" cy="5" r="1"></circle><circle cx="9" cy="19" r="1"></circle><circle cx="15" cy="12" r="1"></circle><circle cx="15" cy="5" r="1"></circle><circle cx="15" cy="19" r="1"></circle></svg>
          </div>

          <!-- Interactive SVG Checkbox Button for To-Do tasks -->
          <button type="button" onclick="event.stopPropagation(); toggleTaskComplete(${task.id})" aria-label="${task.completed ? 'Mark task incomplete' : 'Mark task complete'}" class="shrink-0 cursor-pointer p-0 w-[18px] h-[18px] text-slate-300 hover:text-slate-600 transition-colors relative" style="width:18px;height:18px;min-width:18px;min-height:18px;">
            <svg style="width:18px;height:18px;position:absolute;inset:0;" class="w-[18px] h-[18px] absolute inset-0 transition-all duration-200 ${task.completed ? 'opacity-0 scale-50' : 'opacity-100 scale-100'}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="3" rx="2"></rect></svg>
            <svg style="width:18px;height:18px;position:absolute;inset:0;" class="w-[18px] h-[18px] absolute inset-0 transition-all duration-200 ${task.completed ? 'opacity-100 scale-100 text-emerald-600' : 'opacity-0 scale-50'}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 11 3 3L22 4"></path><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
          </button>

          <div class="flex-1 min-w-0">
            <div class="text-[14px] text-slate-900 leading-snug truncate ${task.completed ? 'line-through text-slate-400' : ''}">${task.title}</div>
          </div>

          <svg class="w-4 h-4 text-slate-300 shrink-0 opacity-60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"></path></svg>
        `;

        container.appendChild(row);
      });

      // Calculate and update To-Do completion percentage bar and text counts
      const total = todoTasks.length;
      const pct = total > 0 ? Math.round((completedCount / total) * 100) : 0;
      document.getElementById('todo-percent-val').textContent = `${pct}%`;
      document.getElementById('todo-progress-bar').style.width = `${pct}%`;
      document.getElementById('todo-completed-text').textContent = `${completedCount} / ${total} completed`;
      document.getElementById('todo-badge-count').textContent = total;
      document.getElementById('todo-sidebar-count-all').textContent = total;
      document.getElementById('todo-view-count').textContent = total;
    }

    function toggleTaskComplete(taskId) {
      const task = todoTasks.find(t => t.id === taskId);
      if (task) {
        task.completed = !task.completed;
        renderTodoList(); // Re-render to update checkbox state & task completion meter
      }
    }

    function selectTaskForDetail(taskId) {
      selectedTaskId = taskId;
      const task = todoTasks.find(t => t.id === taskId);
      const pane = document.getElementById('todo-detail-pane');

      if (!task) {
        pane.classList.add('hidden');
        pane.classList.remove('flex');
        return;
      }

      pane.classList.remove('hidden');
      pane.classList.add('flex');
      document.getElementById('detail-task-title').value = task.title;
      document.getElementById('detail-task-desc').value = task.desc || '';
      setDetailPriority(task.priority || 'None');

      document.getElementById('btn-save-detail').disabled = true;
      document.getElementById('btn-save-detail').className = "flex-1 py-2 rounded-lg text-[12px] font-semibold bg-slate-100 text-slate-400 transition-colors cursor-default";

      renderTodoList();
    }

    function closeTaskDetailPane() {
      const pane = document.getElementById('todo-detail-pane');
      pane.classList.add('hidden');
      pane.classList.remove('flex');
      selectedTaskId = null;
      renderTodoList();
    }

    function markTaskDetailDirty() {
      const btn = document.getElementById('btn-save-detail');
      btn.disabled = false;
      btn.className = "flex-1 py-2 rounded-lg text-[12px] font-semibold bg-slate-900 text-white hover:bg-slate-800 transition-colors cursor-pointer";
    }

    function setDetailPriority(prio) {
      ['None', 'P1', 'P2', 'P3'].forEach(p => {
        const btn = document.getElementById(`prio-${p.toLowerCase()}`);
        if (btn) {
          if (p === prio) {
            btn.className = "flex-1 py-1.5 rounded-md text-[11px] font-semibold cursor-pointer flex items-center justify-center gap-1 border border-slate-900 bg-slate-900 text-white";
          } else {
            btn.className = "flex-1 py-1.5 rounded-md text-[11px] font-semibold cursor-pointer flex items-center justify-center gap-1 border border-slate-200 bg-transparent text-slate-400";
          }
        }
      });
      markTaskDetailDirty();
    }

    function saveTaskDetails() {
      const task = todoTasks.find(t => t.id === selectedTaskId);
      if (task) {
        task.title = document.getElementById('detail-task-title').value;
        task.desc = document.getElementById('detail-task-desc').value;
        renderTodoList();
        document.getElementById('btn-save-detail').disabled = true;
        document.getElementById('btn-save-detail').className = "flex-1 py-2 rounded-lg text-[12px] font-semibold bg-slate-100 text-slate-400 transition-colors cursor-default";
      }
    }

    function deleteCurrentDetailTask() {
      if (selectedTaskId) {
        todoTasks = todoTasks.filter(t => t.id !== selectedTaskId);
        closeTaskDetailPane();
        renderTodoList();
      }
    }

    function openNewTaskModal() {
      document.getElementById('modal-new-task').classList.remove('hidden');
      document.getElementById('modal-new-task').classList.add('flex');
      document.getElementById('input-new-task-title').value = '';
      document.getElementById('input-new-task-desc').value = '';
      validateNewTaskForm();
    }

    function closeNewTaskModal() {
      document.getElementById('modal-new-task').classList.add('hidden');
      document.getElementById('modal-new-task').classList.remove('flex');
    }

    function validateNewTaskForm() {
      const title = document.getElementById('input-new-task-title').value;
      const btn = document.getElementById('btn-create-task');

      if (title && title.trim().length > 0) {
        btn.disabled = false;
        btn.className = "w-full py-2.5 rounded-lg text-[12px] font-semibold bg-slate-900 text-white hover:bg-slate-800 transition-colors cursor-pointer";
      } else {
        btn.disabled = true;
        btn.className = "w-full py-2.5 rounded-lg text-[12px] font-semibold bg-slate-100 text-slate-400 transition-colors cursor-default";
      }
    }

    function setNewTaskPriority(prio, btnElement) {
      document.querySelectorAll('.modal-prio-btn').forEach(b => {
        b.className = "modal-prio-btn flex-1 py-1.5 rounded-md text-[11px] font-semibold cursor-pointer flex items-center justify-center gap-1 border border-slate-200 bg-transparent text-slate-400";
      });
      btnElement.className = "modal-prio-btn flex-1 py-1.5 rounded-md text-[11px] font-semibold cursor-pointer flex items-center justify-center gap-1 border border-slate-900 bg-slate-900 text-white";
      newTaskPriority = prio;
    }

    function createNewTask() {
      const title = document.getElementById('input-new-task-title').value;
      const desc = document.getElementById('input-new-task-desc').value;

      if (title && title.trim()) {
        const newId = Date.now();
        todoTasks.push({
          id: newId,
          title: title.trim(),
          desc: desc,
          priority: newTaskPriority,
          completed: false
        });

        closeNewTaskModal();
        renderTodoList();
        selectTaskForDetail(newId);
      }
    }

    function setPackingFilter(type) {}
    function setPackingStatusFilter(status) {
      document.querySelectorAll('#packing-status-all, #packing-status-open, #packing-status-done').forEach(b => {
        b.className = "inline-flex items-center h-[30px] px-3 rounded-full border border-transparent text-[12.5px] font-normal text-slate-500 hover:text-slate-800 transition-colors";
      });
      document.getElementById(`packing-status-${status}`).className = "inline-flex items-center h-[30px] px-3 rounded-full border border-transparent text-[12.5px] font-semibold bg-slate-900 text-white transition-colors";
    }
    function setTodoTaskFilter(filter) {}
    function sortTodoTasks(type) {}
  </script>
</body>
</html>
