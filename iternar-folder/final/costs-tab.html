<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Trip Costs & Budget</title>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{
  --nav-h:48px;
  --accent:#0f172a; --accent-text:#fff;
  --text-primary:#0f172a; --text-muted:#64748b; --text-faint:#94a3b8;
  --bg:#f1f5f9; --card:#fff; --surface2:#f1f5f9;
  --border:#e2e8f0; --border-faint:#eef1f5;
  --green:#16a34a; --amber:#d97706; --red:#dc2626; --blue:#2563eb;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--bg);font-family:var(--font);color:var(--text-primary)}
button,input,select{font-family:inherit}
svg{flex-shrink:0}

/* nav (same as planner) */
.top-nav{position:fixed;top:0;left:0;right:0;height:var(--nav-h);z-index:200;display:flex;align-items:center;justify-content:center;padding:0 12px;background:rgba(255,255,255,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
.tabs{position:relative;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.tabs::-webkit-scrollbar{display:none}
.pill{position:absolute;top:50%;left:0;width:80px;height:32px;background:var(--accent);border-radius:20px;transform:translateY(-50%);transition:left .32s cubic-bezier(.77,0,.175,1),width .32s cubic-bezier(.77,0,.175,1);z-index:0;pointer-events:none}
.tab{position:relative;z-index:1;display:flex;align-items:center;gap:6px;padding:6px 16px;border:0;border-radius:20px;background:transparent;color:var(--text-muted);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;transition:color .22s}
.tab.active{color:#fff;font-weight:600}

/* page */
.page{max-width:1240px;margin:0 auto;padding:calc(var(--nav-h) + 28px) 24px 48px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.head h1{font-size:26px;font-weight:600;letter-spacing:-.025em}
.head p{margin-top:4px;font-size:13px;color:var(--text-muted)}
.head-r{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:var(--card);border:1px solid var(--border);font-size:13px;font-weight:500;color:var(--text-muted);white-space:nowrap}
.chip b{color:var(--text-primary)}
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 18px;border-radius:12px;border:0;background:var(--accent);color:#fff;font-size:14px;font-weight:600;cursor:pointer}
.btn:hover{opacity:.9}
.btn.ghost{background:var(--card);color:var(--text-primary);border:1px solid var(--border);font-weight:500}

.card{background:var(--card);border:1px solid var(--border);border-radius:22px;padding:24px 26px;position:relative;overflow:hidden}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px}
.grid2{display:grid;gap:16px;margin-bottom:16px}
.g-main{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g-half{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}

/* stat cards */
.stat-top{display:flex;align-items:center;gap:11px}
.ico{width:36px;height:36px;border-radius:11px;display:grid;place-items:center}
.stat-top .t{font-size:13px;font-weight:600}
.stat-top .s{font-size:12px;color:var(--text-faint)}
.stat-top .edit{margin-left:auto;width:30px;height:30px;border-radius:50%;border:1px solid var(--border);background:var(--card);color:var(--text-muted);display:grid;place-items:center;cursor:pointer}
.stat-top .edit:hover{background:var(--surface2);color:var(--text-primary)}
.big{font-size:44px;font-weight:600;letter-spacing:-.035em;line-height:1;margin-top:20px;display:flex;align-items:baseline;min-height:44px}
.big .cur{font-size:24px;font-weight:500;color:var(--text-faint);margin-right:8px}
.big input{font:inherit;letter-spacing:inherit;color:inherit;width:100%;border:0;border-bottom:2px solid var(--accent);background:none;outline:none;padding:0}
.stat-foot{margin-top:16px;font-size:12.5px;color:var(--text-muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.status{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700}
.bar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden;margin-top:14px}
.bar span{display:block;height:100%;border-radius:3px;transition:width .4s}
.card.dark{background:linear-gradient(135deg,#1f2937,#111827);border-color:#111827;color:#fff}
.card.dark .stat-top .s{color:rgba(255,255,255,.6)}
.card.dark .big .cur{color:rgba(255,255,255,.55)}
.card.dark .stat-foot{color:rgba(255,255,255,.8)}
.card.dark .bar{background:rgba(255,255,255,.15)}

.label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.12em;color:var(--text-faint)}
.c-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.c-head h2{font-size:15px;font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-muted)}
.legend i{display:inline-block;width:18px;height:0;border-top:3px solid;vertical-align:middle;margin-right:6px;border-radius:2px}
.legend i.d{border-top-style:dashed;border-top-width:2px}

/* line chart */
.chart{position:relative}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:var(--font);font-size:11px;fill:var(--text-faint)}
.tip{position:absolute;pointer-events:none;background:var(--accent);color:#fff;border-radius:12px;padding:9px 12px;font-size:12px;line-height:1.5;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .12s;z-index:5;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.tip b{font-weight:600}
.tip small{opacity:.65;display:block}

/* pie */
.pie-wrap{display:flex;flex-direction:column;align-items:center;gap:16px}
.pie-wrap svg{width:100%;max-width:230px;height:auto;overflow:visible}
.slice{cursor:pointer;transition:transform .15s,opacity .15s}
.pie-cap{text-align:center;font-size:12.5px;color:var(--text-muted);min-height:36px}
.pie-cap b{display:block;font-size:16px;color:var(--text-primary);font-weight:600}
.leg-list{width:100%;display:flex;flex-direction:column;gap:2px}
.leg-row{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:6px 8px;border-radius:9px;font-size:13px;cursor:default}
.leg-row:hover,.leg-row.on{background:var(--surface2)}
.leg-row i{width:10px;height:10px;border-radius:3px}
.leg-row .a{color:var(--text-muted);font-weight:600}
.leg-row .p{color:var(--text-faint);font-size:12px;width:40px;text-align:right}

/* category budgets */
.cat-list{display:flex;flex-direction:column;gap:16px}
.cat-row .top{display:flex;align-items:center;gap:11px}
.cat-ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center}
.cat-row .n{font-size:14px;font-weight:600}
.cat-row .m{font-size:12px;color:var(--text-faint)}
.cat-row .r{margin-left:auto;text-align:right}
.cat-row .r b{font-size:14px;font-weight:600;display:block}
.cat-row .r span{font-size:12px;font-weight:600}

/* expense list */
.exp-list{display:flex;flex-direction:column;gap:8px}
.exp{display:grid;grid-template-columns:40px 1fr auto auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--border);border-radius:14px}
.exp .e-ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.exp .e-n{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exp .e-c{font-size:11.5px;color:var(--text-faint);margin-top:1px}
.amt{display:inline-flex;padding:5px 12px;border-radius:999px;background:var(--surface2);border:1px solid var(--border);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.x{width:28px;height:28px;border-radius:50%;border:0;background:none;color:#dc2626;display:grid;place-items:center;cursor:pointer}
.x:hover{background:rgba(220,38,38,.1)}

/* modal */
.backdrop{position:fixed;inset:0;z-index:1000;background:rgba(15,23,42,.5);display:none;align-items:center;justify-content:center;padding:16px}
.backdrop.show{display:flex}
.modal{width:100%;max-width:440px;background:#fff;border-radius:18px;box-shadow:0 20px 50px rgba(0,0,0,.3);overflow:hidden}
.modal header{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border)}
.modal header h3{font-size:17px;font-weight:600}
.modal header button{border:0;background:none;color:var(--text-faint);cursor:pointer;display:grid;place-items:center;padding:6px;border-radius:8px}
.modal form{padding:20px 22px;display:flex;flex-direction:column;gap:14px}
.modal label{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.12em;color:var(--text-faint);margin-bottom:6px}
.modal input,.modal select{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;font-size:14px;background:#fff;outline:none}
.modal input:focus,.modal select:focus{border-color:var(--accent)}
.modal .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal footer{display:flex;justify-content:flex-end;gap:8px;padding:14px 22px;border-top:1px solid var(--border)}
.modal footer button{padding:8px 18px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:#fff;color:var(--text-muted)}
.modal footer .ok{background:var(--accent);border-color:var(--accent);color:#fff}

@media(max-width:1000px){
  .grid3,.g-main,.g-half{grid-template-columns:1fr}
}
@media(max-width:560px){
  .page{padding-left:14px;padding-right:14px}
  .big{font-size:36px}
  .exp{grid-template-columns:40px 1fr auto}
  .exp .x{display:none}
}
</style>
</head>
<body>

<div class="top-nav">
  <div class="tabs" id="tabs">
    <div class="pill" id="pill"></div>
    <button class="tab"><i data-lucide="map" style="width:15px;height:15px"></i><span>Plan</span></button>
    <button class="tab"><i data-lucide="tram-front" style="width:15px;height:15px"></i><span>Transports</span></button>
    <button class="tab"><i data-lucide="ticket" style="width:15px;height:15px"></i><span>Book</span></button>
    <button class="tab"><i data-lucide="package-check" style="width:15px;height:15px"></i><span>Lists</span></button>
    <button class="tab active"><i data-lucide="wallet" style="width:15px;height:15px"></i><span>Costs</span></button>
    <button class="tab"><i data-lucide="folder-open" style="width:15px;height:15px"></i><span>Files</span></button>
    <button class="tab"><i data-lucide="users" style="width:15px;height:15px"></i><span>Collab</span></button>
  </div>
</div>

<main class="page">
  <div class="head">
    <div>
      <h1>Costs &amp; Budget</h1>
      <p>Track spending against your trip budget.</p>
    </div>
    <div class="head-r">
      <span class="chip">Sep 12 – Sep 21 · <b>10 days</b></span>
      <button class="btn ghost" id="exportBtn"><i data-lucide="download" style="width:15px;height:15px"></i>Export CSV</button>
      <button class="btn" id="addBtn"><i data-lucide="plus" style="width:16px;height:16px"></i>Add expense</button>
    </div>
  </div>

  <!-- stat cards -->
  <section class="grid3">
    <div class="card" id="cBudget"></div>
    <div class="card dark" id="cSpent"></div>
    <div class="card" id="cSaved"></div>
  </section>

  <!-- line + pie -->
  <section class="grid2 g-main">
    <div class="card">
      <div class="c-head">
        <h2>Spending over time</h2>
        <div class="legend">
          <span><i style="border-color:#0f172a"></i>Cumulative spend</span>
          <span><i class="d" style="border-color:#2563eb"></i>Budget pace</span>
          <span><i class="d" style="border-color:#dc2626"></i>Budget limit</span>
        </div>
      </div>
      <div class="chart" id="lineChart"></div>
    </div>
    <div class="card">
      <div class="c-head"><h2>By category</h2></div>
      <div class="pie-wrap">
        <div id="pie" style="width:100%;display:flex;justify-content:center"></div>
        <div class="pie-cap" id="pieCap"></div>
        <div class="leg-list" id="pieLegend"></div>
      </div>
    </div>
  </section>

  <!-- category budgets + expenses -->
  <section class="grid2 g-half">
    <div class="card">
      <div class="c-head"><h2>Category budgets</h2><span class="label" id="catHint"></span></div>
      <div class="cat-list" id="catList"></div>
    </div>
    <div class="card">
      <div class="c-head"><h2>Biggest expenses</h2><span class="label" id="expCount"></span></div>
      <div class="exp-list" id="expList"></div>
    </div>
  </section>
</main>

<!-- add expense modal -->
<div class="backdrop" id="modal">
  <div class="modal">
    <header><h3>Add expense</h3><button type="button" id="mClose" aria-label="Close"><i data-lucide="x" style="width:20px;height:20px"></i></button></header>
    <form id="form">
      <div><label>What was it for?</label><input id="fName" placeholder="e.g. Dinner, souvenirs, gas…" required></div>
      <div class="row2">
        <div><label>Amount (ISK)</label><input id="fAmt" inputmode="decimal" placeholder="0" required></div>
        <div><label>Day</label><select id="fDay"></select></div>
      </div>
      <div><label>Category</label><select id="fCat"></select></div>
    </form>
    <footer><button type="button" id="mCancel">Cancel</button><button type="submit" form="form" class="ok">Add expense</button></footer>
  </div>
</div>

<script>
/* ================= DATA ================= */
const DAYS = 10;
const START = new Date(2027, 8, 12);
const dayLabel = i => { const d = new Date(START); d.setDate(d.getDate()+i); return d.toLocaleDateString('en-US',{month:'short',day:'numeric'}); };

const CATS = {
  transport:{label:'Transport',color:'#2563eb',icon:'bus',share:.50},
  accommodation:{label:'Accommodation',color:'#16a34a',icon:'hotel',share:.20},
  food:{label:'Food & drink',color:'#ea580c',icon:'utensils',share:.1625},
  activities:{label:'Activities',color:'#9333ea',icon:'ticket',share:.075},
  other:{label:'Other',color:'#6b7280',icon:'more-horizontal',share:.0625}
};
const ALL = Array.from({length:DAYS},(_,i)=>i);
let uid = 1;
const E = [
  {name:'Flights, two people',cat:'transport',amount:125000,days:[0]},
  {name:'4x4 hire, ten days',cat:'transport',amount:186000,days:[0]},
  {name:'Fuel, roughly 1800 km',cat:'transport',amount:78000,days:ALL},
  {name:'Guesthouses and apartments',cat:'accommodation',amount:151000,days:[0,1,2,3,4,5,6,7,8]},
  {name:'Blue Lagoon and Myvatn baths',cat:'activities',amount:32980,days:[0,6]},
  {name:'Glacier lagoon boat',cat:'activities',amount:23000,days:[4]},
  {name:'Supermarket food, mostly Bonus',cat:'food',amount:62000,days:[0,2,4,6,8]},
  {name:'Restaurant meals, six of them',cat:'food',amount:54000,days:[1,3,5,7,9,0]},
  {name:'Parking fees at waterfalls',cat:'other',amount:4000,days:[1,2,3]}
].map(e=>({id:uid++,...e}));

let budget = 800000;
try{const b=+localStorage.getItem('trip-budget'); if(b>0) budget=b}catch(e){}

/* ================= HELPERS ================= */
const $ = id => document.getElementById(id);
const fmt = n => Math.round(n).toLocaleString('en-IN');
const isk = n => 'ISK\u00A0'+fmt(n);
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const icons = () => lucide.createIcons();
const tint = (c,a='22') => c+a;

const total = () => E.reduce((a,e)=>a+e.amount,0);
function byCat(){
  const m={}; Object.keys(CATS).forEach(k=>m[k]=0);
  E.forEach(e=>m[e.cat]+=e.amount); return m;
}
function daily(){
  const d=Array(DAYS).fill(0);
  E.forEach(e=>{
    const n=e.days.length, base=Math.floor(e.amount/n);
    let rem=e.amount-base*n;
    e.days.forEach(i=>{d[i]+=base+(rem>0?rem:0);rem=0});
  });
  return d;
}
function state(pct){
  if(pct>100) return {t:'Over budget',c:'#dc2626'};
  if(pct>=85) return {t:'Near limit',c:'#d97706'};
  return {t:'On track',c:'#16a34a'};
}

/* ================= STAT CARDS ================= */
let editingBudget=false;
function renderStats(){
  const spent=total(), saved=budget-spent, pct=spent/budget*100, st=state(pct);

  // Budget
  $('cBudget').innerHTML=`
    <div class="stat-top">
      <span class="ico" style="background:rgba(37,99,235,.13);color:#2563eb"><i data-lucide="target" style="width:18px;height:18px"></i></span>
      <div><div class="t">Total budget</div><div class="s">What you planned to spend</div></div>
      <button class="edit" id="editBudget" title="Edit budget"><i data-lucide="${editingBudget?'check':'pencil'}" style="width:13px;height:13px"></i></button>
    </div>
    <div class="big" style="color:#2563eb"><span class="cur">ISK</span>${editingBudget?`<input id="budgetInput" inputmode="numeric" value="${budget}">`:`<span>${fmt(budget)}</span>`}</div>
    <div class="stat-foot"><span>${isk(budget/DAYS)} per day · 10 days</span></div>`;

  // Spent
  $('cSpent').innerHTML=`
    <div class="stat-top">
      <span class="ico" style="background:rgba(255,255,255,.12);color:#fff"><i data-lucide="bar-chart-3" style="width:18px;height:18px"></i></span>
      <div><div class="t">Total expenses</div><div class="s">${E.length} expenses logged</div></div>
    </div>
    <div class="big"><span class="cur">ISK</span><span>${fmt(spent)}</span></div>
    <div class="bar"><span style="width:${Math.min(100,pct)}%;background:${pct>100?'#f87171':pct>=85?'#fbbf24':'#fff'}"></span></div>
    <div class="stat-foot"><span><b>${pct.toFixed(1)}%</b> of budget used</span><span>·</span><span>${isk(spent/DAYS)} per day</span></div>`;

  // Saved
  const good=saved>=0, col=good?'#16a34a':'#dc2626';
  $('cSaved').innerHTML=`
    <div class="stat-top">
      <span class="ico" style="background:${tint(col,'22')};color:${col}"><i data-lucide="${good?'piggy-bank':'alert-triangle'}" style="width:18px;height:18px"></i></span>
      <div><div class="t">${good?'Saved':'Over budget'}</div><div class="s">${good?'Budget still available':'You are over the limit'}</div></div>
      <span class="status" style="margin-left:auto;background:${tint(st.c,'22')};color:${st.c}">${st.t}</span>
    </div>
    <div class="big" style="color:${col}"><span class="cur">ISK</span><span>${good?'':'-'}${fmt(Math.abs(saved))}</span></div>
    <div class="stat-foot"><span>${good?`${(100-pct).toFixed(1)}% of your budget is left`:`${(pct-100).toFixed(1)}% above your budget`}</span></div>`;

  $('editBudget').onclick=()=>{
    if(editingBudget){commitBudget()}else{editingBudget=true;renderStats();const i=$('budgetInput');i.focus();i.select()}
  };
  const bi=$('budgetInput');
  if(bi){
    bi.addEventListener('keydown',e=>{if(e.key==='Enter')commitBudget();if(e.key==='Escape'){editingBudget=false;renderStats()}});
  }
  icons();
}
function commitBudget(){
  const v=parseFloat(String($('budgetInput').value).replace(/[^0-9.]/g,''));
  if(v>0){budget=v;try{localStorage.setItem('trip-budget',v)}catch(e){}}
  editingBudget=false;renderAll();
}

/* ================= LINE CHART ================= */
function niceMax(v){
  const p=Math.pow(10,Math.floor(Math.log10(v)));
  return [1,1.2,1.5,2,2.5,3,4,5,6,8,10].map(c=>c*p).find(c=>c>=v);
}
function renderLine(){
  const W=700,H=300,m={l:54,r:18,t:16,b:34},iw=W-m.l-m.r,ih=H-m.t-m.b;
  const d=daily(); let run=0; const cum=d.map(v=>run+=v);
  const yMax=niceMax(Math.max(budget,cum[DAYS-1])*1.05);
  const x=i=>m.l+iw*i/(DAYS-1), y=v=>m.t+ih*(1-v/yMax);
  const kfmt=v=>v>=1000?(v/1000)+'k':v;
  let g='';
  for(let k=0;k<=4;k++){
    const v=yMax*k/4, yy=y(v);
    g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${yy}" y2="${yy}" stroke="#e2e8f0" ${k?'stroke-dasharray="3 4"':''}/><text x="${m.l-10}" y="${yy+4}" text-anchor="end">${kfmt(Math.round(v))}</text>`;
  }
  for(let i=0;i<DAYS;i++) g+=`<text x="${x(i)}" y="${H-10}" text-anchor="middle">${dayLabel(i)}</text>`;
  const pts=cum.map((v,i)=>[x(i),y(v)]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=line+` L${x(DAYS-1)} ${y(0)} L${x(0)} ${y(0)} Z`;
  const pace=Array.from({length:DAYS},(_,i)=>[x(i),y(budget*(i+1)/DAYS)]);
  const paceLine=pace.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const dots=pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#fff" stroke="#0f172a" stroke-width="2"/>`).join('');
  const colW=iw/(DAYS-1);
  const hits=Array.from({length:DAYS},(_,i)=>`<rect data-i="${i}" x="${x(i)-colW/2}" y="${m.t}" width="${colW}" height="${ih}" fill="transparent"/>`).join('');
  $('lineChart').innerHTML=`
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Cumulative spending over the trip">
      <defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f172a" stop-opacity=".16"/><stop offset="1" stop-color="#0f172a" stop-opacity="0"/></linearGradient></defs>
      ${g}
      <line x1="${m.l}" x2="${W-m.r}" y1="${y(budget)}" y2="${y(budget)}" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6 5"/>
      <path d="${paceLine}" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 5"/>
      <path d="${area}" fill="url(#ag)"/>
      <path d="${line}" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      ${dots}
      <line id="guide" y1="${m.t}" y2="${m.t+ih}" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3" style="display:none"/>
      <circle id="hdot" r="6" fill="#0f172a" stroke="#fff" stroke-width="2.5" style="display:none"/>
      ${hits}
    </svg>
    <div class="tip" id="tip"></div>`;
  const wrap=$('lineChart'), tip=$('tip'), guide=$('guide'), hdot=$('hdot');
  wrap.querySelectorAll('rect[data-i]').forEach(r=>{
    r.addEventListener('mouseenter',()=>{
      const i=+r.dataset.i, px=x(i), py=y(cum[i]);
      guide.setAttribute('x1',px);guide.setAttribute('x2',px);guide.style.display='';
      hdot.setAttribute('cx',px);hdot.setAttribute('cy',py);hdot.style.display='';
      const paceV=budget*(i+1)/DAYS, diff=paceV-cum[i];
      tip.innerHTML=`<b>${dayLabel(i)} · Day ${i+1}</b><br>Spent that day: ${isk(d[i])}<br>Total so far: ${isk(cum[i])}<small>${diff>=0?isk(diff)+' under pace':isk(-diff)+' over pace'}</small>`;
      const box=wrap.getBoundingClientRect(), svg=wrap.querySelector('svg').getBoundingClientRect();
      tip.style.left=(px/W*svg.width)+'px';
      tip.style.top=(py/H*svg.height)+'px';
      tip.style.opacity=1;
    });
    r.addEventListener('mouseleave',()=>{guide.style.display='none';hdot.style.display='none';tip.style.opacity=0});
  });
}

/* ================= PIE ================= */
function polar(cx,cy,r,a){return [cx+r*Math.cos(a),cy+r*Math.sin(a)]}
function renderPie(){
  const t=total(), sums=byCat();
  const items=Object.keys(CATS).filter(k=>sums[k]>0).map(k=>({k,v:sums[k],...CATS[k]}));
  const cx=110,cy=110,r=98;
  let a0=-Math.PI/2, paths='';
  items.forEach((it,idx)=>{
    const frac=it.v/t, a1=a0+frac*2*Math.PI, mid=(a0+a1)/2;
    it.mid=mid;
    if(items.length===1){
      paths+=`<circle class="slice" data-k="${it.k}" cx="${cx}" cy="${cy}" r="${r}" fill="${it.color}" stroke="#fff" stroke-width="3"/>`;
    }else{
      const [x1,y1]=polar(cx,cy,r,a0),[x2,y2]=polar(cx,cy,r,a1);
      paths+=`<path class="slice" data-k="${it.k}" d="M${cx} ${cy} L${x1.toFixed(2)} ${y1.toFixed(2)} A${r} ${r} 0 ${frac>.5?1:0} 1 ${x2.toFixed(2)} ${y2.toFixed(2)} Z" fill="${it.color}" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>`;
    }
    a0=a1;
  });
  $('pie').innerHTML=`<svg viewBox="0 0 220 220" role="img" aria-label="Spending by category">${paths}</svg>`;
  $('pieLegend').innerHTML=items.map(it=>`
    <div class="leg-row" data-k="${it.k}"><i style="background:${it.color}"></i><span>${it.label}</span><span class="a">${isk(it.v)}</span><span class="p">${(it.v/t*100).toFixed(1)}%</span></div>`).join('');
  const cap=$('pieCap'), def=()=>{cap.innerHTML=`<b>${isk(t)}</b>Total spent · hover a slice`};
  def();
  const set=(k,on)=>{
    document.querySelectorAll('.slice').forEach(s=>{
      const me=s.dataset.k===k;
      s.style.opacity=on&&!me?.45:1;
      const it=items.find(i=>i.k===s.dataset.k);
      s.style.transform=on&&me?`translate(${Math.cos(it.mid)*7}px,${Math.sin(it.mid)*7}px)`:'';
    });
    document.querySelectorAll('.leg-row').forEach(l=>l.classList.toggle('on',on&&l.dataset.k===k));
    if(on){const it=items.find(i=>i.k===k);cap.innerHTML=`<b>${isk(it.v)}</b>${it.label} · ${(it.v/t*100).toFixed(1)}%`}else def();
  };
  document.querySelectorAll('.slice,.leg-row').forEach(el=>{
    el.addEventListener('mouseenter',()=>set(el.dataset.k,true));
    el.addEventListener('mouseleave',()=>set(el.dataset.k,false));
  });
}

/* ================= CATEGORY BUDGETS ================= */
function renderCats(){
  const sums=byCat();
  $('catHint').textContent='Split of '+isk(budget);
  $('catList').innerHTML=Object.keys(CATS).map(k=>{
    const c=CATS[k], cb=budget*c.share, sp=sums[k], pct=cb?sp/cb*100:0, st=state(pct);
    const left=cb-sp;
    return `<div class="cat-row">
      <div class="top">
        <span class="cat-ico" style="background:${tint(c.color,'22')};color:${c.color}"><i data-lucide="${c.icon}" style="width:17px;height:17px"></i></span>
        <div><div class="n">${c.label}</div><div class="m">${isk(sp)} of ${isk(cb)}</div></div>
        <div class="r"><b>${pct.toFixed(0)}%</b><span style="color:${st.c}">${left>=0?isk(left)+' left':isk(-left)+' over'}</span></div>
      </div>
      <div class="bar"><span style="width:${Math.min(100,pct)}%;background:${st.c==='#16a34a'?c.color:st.c}"></span></div>
    </div>`;
  }).join('');
}

/* ================= EXPENSE LIST ================= */
function renderExpenses(){
  const list=[...E].sort((a,b)=>b.amount-a.amount).slice(0,6);
  $('expCount').textContent=`Top ${list.length} of ${E.length}`;
  $('expList').innerHTML=list.map(e=>{
    const c=CATS[e.cat];
    return `<div class="exp">
      <span class="e-ico" style="background:${tint(c.color,'22')};color:${c.color}"><i data-lucide="${c.icon}" style="width:19px;height:19px"></i></span>
      <div style="min-width:0"><div class="e-n">${esc(e.name)}</div><div class="e-c">${c.label} · ${e.days.length===DAYS?'whole trip':e.days.length>1?e.days.length+' days':dayLabel(e.days[0])}</div></div>
      <span class="amt">${isk(e.amount)}</span>
      <button class="x" data-del="${e.id}" title="Delete"><i data-lucide="trash-2" style="width:14px;height:14px"></i></button>
    </div>`;
  }).join('');
  $('expList').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    const i=E.findIndex(e=>e.id==b.dataset.del);if(i>=0){E.splice(i,1);renderAll()}
  });
}

/* ================= MODAL ================= */
$('fCat').innerHTML=Object.keys(CATS).map(k=>`<option value="${k}">${CATS[k].label}</option>`).join('');
$('fDay').innerHTML='<option value="all">Spread over trip</option>'+Array.from({length:DAYS},(_,i)=>`<option value="${i}">Day ${i+1} · ${dayLabel(i)}</option>`).join('');
const openM=()=>{$('modal').classList.add('show');$('fName').focus()};
const closeM=()=>{$('modal').classList.remove('show');$('form').reset()};
$('addBtn').onclick=openM;$('mClose').onclick=closeM;$('mCancel').onclick=closeM;
$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeM()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});
$('form').addEventListener('submit',e=>{
  e.preventDefault();
  const amount=parseFloat(String($('fAmt').value).replace(/[^0-9.]/g,''));
  if(!(amount>0)||!$('fName').value.trim())return;
  const dv=$('fDay').value;
  E.push({id:uid++,name:$('fName').value.trim(),cat:$('fCat').value,amount,days:dv==='all'?ALL:[+dv]});
  closeM();renderAll();
});

/* export */
$('exportBtn').onclick=()=>{
  const rows=[['Name','Category','Amount (ISK)'],...E.map(e=>[`"${e.name.replace(/"/g,'""')}"`,CATS[e.cat].label,e.amount])];
  const url=URL.createObjectURL(new Blob([rows.map(r=>r.join(',')).join('\n')],{type:'text/csv'}));
  const a=document.createElement('a');a.href=url;a.download='trip-expenses.csv';a.click();URL.revokeObjectURL(url);
};

/* nav pill */
const tabs=$('tabs'),pill=$('pill'),btns=tabs.querySelectorAll('.tab');
const move=b=>{pill.style.left=b.offsetLeft+'px';pill.style.width=b.offsetWidth+'px'};
btns.forEach(b=>b.addEventListener('click',()=>{btns.forEach(x=>x.classList.remove('active'));b.classList.add('active');move(b)}));

/* init */
function renderAll(){renderStats();renderLine();renderPie();renderCats();renderExpenses();icons()}
icons();renderAll();
setTimeout(()=>move(tabs.querySelector('.tab.active')),60);
addEventListener('load',()=>move(tabs.querySelector('.tab.active')));
</script>
</body>
