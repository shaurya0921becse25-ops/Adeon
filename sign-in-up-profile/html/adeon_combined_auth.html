<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adeon — Sign In / Sign Up</title>
<style>
:root{--ink:#111827;--muted:#667085;--teal:#064b55;--teal-hover:#083f47;--line:#d9dee5}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink)}
body{min-height:100vh;display:grid;place-items:center;padding:28px;position:relative;isolation:isolate;overflow-x:hidden;background:#000}
#backgroundVideo{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;background:#000}
body::after{content:"";position:fixed;inset:0;z-index:-1;background:rgba(0,0,0,.08);pointer-events:none}
.auth-shell{width:min(1120px,100%);min-height:660px;display:grid;grid-template-columns:.94fr 1fr;overflow:hidden;border:1px solid rgba(255,255,255,.94);border-radius:25px;background:transparent;box-shadow:0 22px 70px rgba(0,0,0,.22)}
.story-panel{display:flex;align-items:flex-end;min-width:0;padding:46px 48px;color:#fff;background:transparent;border-radius:24px 0 0 24px}
.story-copy{max-width:430px;text-shadow:0 2px 14px rgba(0,0,0,.58)}
.story-copy h1{margin:0 0 13px;font-size:clamp(30px,3.05vw,43px);line-height:1.08;letter-spacing:-1.25px;font-weight:850;text-transform:uppercase}
.story-copy p{margin:0 0 14px;max-width:400px;color:rgba(255,255,255,.96);font-size:14px;line-height:1.45}
.story-copy .closing-line{margin-top:17px;margin-bottom:0}
.form-panel{display:flex;align-items:center;justify-content:center;min-width:0;padding:34px 54px;background:#fff;border-radius:0 24px 24px 0}
.form-content{width:100%;max-width:400px;animation:formIn .32s ease both}
.form-content.is-changing{animation:formOut .15s ease both}
@keyframes formIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes formOut{to{opacity:0;transform:translateY(-5px)}}
.form-heading{margin:0 0 7px;color:#111827;font-size:28px;line-height:1.15;letter-spacing:-.8px;font-weight:800}
.form-subtitle{margin:0 0 25px;color:var(--muted);font-size:12px;line-height:1.5}
.field{margin-bottom:15px}
.field label{display:block;margin-bottom:7px;color:#263142;font-size:12px;font-weight:600}
.input-wrap{position:relative}
.field input{width:100%;height:44px;padding:0 13px;border:1px solid var(--line);border-radius:7px;outline:none;background:#fff;color:#172033;font:inherit;font-size:12px;transition:border-color .18s ease,box-shadow .18s ease}
.field input::placeholder{color:#a0a8b5}
.field input:focus{border-color:#4c8790;box-shadow:0 0 0 3px rgba(6,75,85,.10)}
.password-input{padding-right:45px!important}
.toggle-password{position:absolute;top:50%;right:10px;transform:translateY(-50%);width:27px;height:27px;border:0;padding:0;display:grid;place-items:center;background:transparent;color:#8993a1;cursor:pointer}
.toggle-password svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.form-options{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:3px 0 21px;font-size:11px}
.remember{display:inline-flex;align-items:center;gap:8px;color:#374151;cursor:pointer;user-select:none}
.remember input,.terms-row input{width:14px;height:14px;margin:0;accent-color:var(--teal);flex:0 0 auto}
.role-label{display:block;margin:0 0 9px;color:#263142;font-size:12px;font-weight:700}
.role-options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.role-option{position:relative;display:block;cursor:pointer}
.role-option input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.role-card{min-height:64px;display:flex;align-items:center;gap:9px;padding:10px;border:1px solid var(--line);border-radius:9px;background:#fff;transition:border-color .18s ease,background .18s ease,box-shadow .18s ease}
.role-option input:checked+.role-card{border-color:var(--teal);background:#f0f8f8;box-shadow:0 0 0 2px rgba(6,75,85,.08)}
.role-option input:focus-visible+.role-card{outline:3px solid rgba(23,97,197,.28);outline-offset:2px}
.role-icon{width:32px;height:32px;display:grid;place-items:center;flex:0 0 auto;color:var(--teal);border-radius:8px;background:#e7f0f1}
.role-icon svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.role-name{display:block;margin-bottom:3px;font-size:11px;font-weight:750;color:#172033}
.role-description{display:block;color:#667085;font-size:9px;line-height:1.3}
.terms-row{display:flex;align-items:flex-start;gap:8px;margin:2px 0 15px;color:#596273;font-size:10px;line-height:1.5}
.terms-row input{margin-top:1px}
a{color:var(--teal);text-decoration:none;font-weight:650}
a:hover{text-decoration:underline}
.primary-button,.google-button{width:100%;min-height:43px;display:flex;justify-content:center;align-items:center;gap:10px;border-radius:7px;font-family:inherit;font-size:12px;font-weight:650;cursor:pointer;transition:background .18s ease,transform .18s ease,box-shadow .18s ease}
.primary-button{border:1px solid var(--teal);background:var(--teal);color:#fff;box-shadow:0 2px 4px rgba(6,75,85,.12)}
.primary-button:hover{background:var(--teal-hover);transform:translateY(-1px)}
.divider{display:flex;align-items:center;gap:13px;margin:15px 0;color:#8b93a0;font-size:10px}
.divider:before,.divider:after{content:"";flex:1;height:1px;background:#e9edf1}
.google-button{min-height:41px;background:#fff;border:1px solid var(--line);color:#344054}
.google-button:hover{background:#f9fafb;box-shadow:0 2px 7px rgba(16,24,40,.06)}
.google-mark{width:17px;height:17px;flex:0 0 auto}
.switch-note{margin:20px 0 0;text-align:center;color:#667085;font-size:11px}
.switch-note a{margin-left:3px}
.form-message{min-height:14px;margin:8px 0 0;color:var(--teal);text-align:center;font-size:10px;line-height:1.4}
@media(max-width:820px){body{padding:20px}.auth-shell{max-width:560px;grid-template-columns:1fr;min-height:auto}.story-panel{min-height:245px;padding:32px;border-radius:24px 24px 0 0}.story-copy h1{font-size:34px}.form-panel{padding:34px 32px;border-radius:0 0 24px 24px}.form-content{max-width:400px}}
@media(max-width:420px){body{padding:12px}.auth-shell{border-radius:18px}.story-panel{min-height:225px;padding:26px 23px}.story-copy h1{font-size:29px}.story-copy p{font-size:13px}.form-panel{padding:29px 22px}.form-heading{font-size:24px}.role-options{gap:7px}.role-card{padding:8px;gap:6px}.role-icon{width:29px;height:29px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
  <!-- Add a video file beside this HTML, then uncomment the source below. -->
  <video id="backgroundVideo" autoplay muted loop playsinline aria-hidden="true">
    <!-- <source src="background-video.mp4" type="video/mp4"> -->
  </video>

  <main class="auth-shell" aria-label="Adeon authentication">
    <section class="story-panel" aria-label="Travel introduction">
      <div class="story-copy">
        <h1>Your<br>Next Adventure<br>Awaits!</h1>
        <p>Log in to unlock exclusive deals, plan your dream escapes, and pick up where you left off. Whether it's mountains, beaches, or city lights</p>
        <p class="closing-line">Your journey starts here.</p>
      </div>
    </section>
    <section class="form-panel" aria-label="Account form">
      <div class="form-content" id="formContent"></div>
    </section>
  </main>

<script>
const formContent = document.getElementById("formContent");
let mode = "signin";

const googleIcon = `<svg class="google-mark" viewBox="0 0 48 48" aria-hidden="true"><path fill="#4285F4" d="M43.6 24.5c0-1.4-.1-2.8-.4-4.1H24v7.8h11a9.4 9.4 0 0 1-4.1 6.2v5.1h6.6c3.9-3.6 6.1-8.9 6.1-15Z"/><path fill="#34A853" d="M24 44c5.5 0 10.1-1.8 13.5-4.9l-6.6-5.1c-1.8 1.2-4.1 2-6.9 2-5.3 0-9.8-3.6-11.4-8.4H5.8v5.3A20 20 0 0 0 24 44Z"/><path fill="#FBBC05" d="M12.6 27.6a12 12 0 0 1 0-7.2v-5.3H5.8a20 20 0 0 0 0 17.8l6.8-5.3Z"/><path fill="#EA4335" d="M24 12c3 0 5.7 1 7.8 3.1l5.8-5.8C34.1 6 29.5 4 24 4A20 20 0 0 0 5.8 15.1l6.8 5.3C14.2 15.6 18.7 12 24 12Z"/></svg>`;
const eyeIcon = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.7"/></svg>`;
const eyeOffIcon = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 6.2A10.8 10.8 0 0 1 12 6c6.1 0 9.5 6 9.5 6a15.7 15.7 0 0 1-3.1 3.7M6.2 6.8C3.8 8.4 2.5 12 2.5 12s3.4 6 9.5 6c1.2 0 2.3-.3 3.3-.7"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>`;

function renderForm(nextMode, animate = true) {
  mode = nextMode;
  if (animate) formContent.classList.add("is-changing");
  const draw = () => {
    formContent.innerHTML = mode === "signin" ? signInMarkup() : signUpMarkup();
    formContent.classList.remove("is-changing");
    wireForm();
  };
  if (animate) {
    window.setTimeout(draw, 140);
  } else {
    draw();
  }
}

function signInMarkup() {
  return `
    <h2 class="form-heading">Welcome Back!</h2>
    <p class="form-subtitle">Sign in to your Adeon account and continue planning your next journey.</p>
    <form id="authForm">
      <div class="field"><label for="email">Email Address</label><div class="input-wrap"><input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required></div></div>
      <div class="field"><label for="password">Password</label><div class="input-wrap"><input class="password-input" id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required><button class="toggle-password" id="togglePassword" type="button" aria-label="Show password" title="Show password">${eyeIcon}</button></div></div>
      <div class="form-options"><label class="remember"><input type="checkbox" name="remember"><span>Remember me</span></label><a href="#" id="forgotLink">Forgot password?</a></div>
      <button class="primary-button" type="submit">Sign in</button>
      <div class="divider"><span>or</span></div>
      <button class="google-button" id="googleButton" type="button">${googleIcon}<span>Sign in with Google</span></button>
      <p class="switch-note">Don't have an account?<a href="#" id="switchMode">Sign up</a></p>
      <p class="form-message" id="formMessage" role="status" aria-live="polite"></p>
    </form>`;
}

function signUpMarkup() {
  return `
    <h2 class="form-heading">Create your account</h2>
    <p class="form-subtitle">Join Adeon and start planning your next journey.</p>
    <form id="authForm">
      <fieldset style="border:0;padding:0;margin:0;min-width:0">
        <legend class="role-label">I want to join Adeon as a…</legend>
        <div class="role-options">
          <label class="role-option"><input type="radio" name="accountRole" value="traveler" checked required><span class="role-card"><span class="role-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="3.2"></circle><path d="M5.5 20v-1.8a6.5 6.5 0 0 1 13 0V20"></path><path d="M8.5 12.7 12 15l3.5-2.3"></path></svg></span><span><span class="role-name">Traveler</span><span class="role-description">Plan trips and explore</span></span></span></label>
          <label class="role-option"><input type="radio" name="accountRole" value="guide" required><span class="role-card"><span class="role-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m12 3 8 4.2v5.3c0 4.4-3.2 7.2-8 8.5-4.8-1.3-8-4.1-8-8.5V7.2L12 3Z"></path><path d="m8.5 12 2.2 2.2 4.8-5"></path></svg></span><span><span class="role-name">Travel Guide</span><span class="role-description">Share local expertise</span></span></span></label>
        </div>
      </fieldset>
      <div class="field"><label for="fullName">Full name</label><input id="fullName" name="fullName" type="text" placeholder="Enter your full name" autocomplete="name" required></div>
      <div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required></div>
      <div class="field"><label for="password">Create password</label><div class="input-wrap"><input class="password-input" id="password" name="password" type="password" placeholder="Create a strong password" autocomplete="new-password" minlength="8" required><button class="toggle-password" id="togglePassword" type="button" aria-label="Show password" title="Show password">${eyeIcon}</button></div></div>
      <label class="terms-row"><input type="checkbox" name="terms" required><span>I agree to the <a href="#" id="termsLink">Terms of Service</a> and <a href="#" id="privacyLink">Privacy Policy</a>.</span></label>
      <button class="primary-button" type="submit">Create account</button>
      <div class="divider"><span>or</span></div>
      <button class="google-button" id="googleButton" type="button">${googleIcon}<span>Sign up with Google</span></button>
      <p class="switch-note">Already have an account?<a href="#" id="switchMode">Sign in</a></p>
      <p class="form-message" id="formMessage" role="status" aria-live="polite"></p>
    </form>`;
}

function wireForm() {
  const form = document.getElementById("authForm");
  const message = document.getElementById("formMessage");
  document.getElementById("switchMode").addEventListener("click", event => {
    event.preventDefault();
    renderForm(mode === "signin" ? "signup" : "signin");
  });

  const toggle = document.getElementById("togglePassword");
  toggle.addEventListener("click", () => {
    const password = document.getElementById("password");
    const showing = password.type === "text";
    password.type = showing ? "password" : "text";
    toggle.innerHTML = showing ? eyeIcon : eyeOffIcon;
    toggle.setAttribute("aria-label", showing ? "Show password" : "Hide password");
    toggle.setAttribute("title", showing ? "Show password" : "Hide password");
  });

  form.addEventListener("submit", event => {
    event.preventDefault();
    if (mode === "signin") {
      message.textContent = "Demo only — connect your sign-in service to authenticate users.";
    } else {
      const data = new FormData(form);
      const role = data.get("accountRole");
      const name = data.get("fullName").trim();
      message.textContent = `Demo only: ${name}, your selected account type is ${role === "guide" ? "Travel Guide" : "Traveler"}. Connect your registration service to create the account.`;
    }
  });

  document.getElementById("googleButton").addEventListener("click", () => {
    message.textContent = mode === "signin" ? "Connect Google OAuth here to enable Google sign-in." : "Connect Google sign-up for the selected account type here.";
  });

  const forgot = document.getElementById("forgotLink");
  if (forgot) forgot.addEventListener("click", event => {
    event.preventDefault();
    message.textContent = "Connect your password-reset flow here.";
  });
  ["termsLink", "privacyLink"].forEach(id => {
    const link = document.getElementById(id);
    if (link) link.addEventListener("click", event => {
      event.preventDefault();
      message.textContent = "Add your published policy URL here.";
    });
  });
}

renderForm("signin", false);
</script>
</body>
</html>
